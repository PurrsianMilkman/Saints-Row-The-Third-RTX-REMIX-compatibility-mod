# RTX Remix Bridge configuration - SR3 RTX Remix project
#
# exposeRemixApi - unlocks Remix's PROGRAMMATIC API through the 32-bit bridge client.
#
# Added 2026-08-31. The shim called remixapi_InitializeLibrary and got rc=11 NOT_INITIALIZED; the
# bridge's own log said exactly why:
#
#   err: Remix API is not enabled. This is currently an experimental feature and must be
#        explicitly enabled in the `bridge.conf`. Please set `exposeRemixApi = True` if you
#        are sure you want it enabled.
#
# So the API is neither missing nor stubbed - it is gated. The key is confirmed present as a
# string in the bridge client d3d9.dll, and this file is the path the bridge reports trying to
# open ("Trying to open config file: ...\.trex\bridge.conf"), which did not exist until now.
#
# What it unlocks: CreateMaterial, CreateMesh, SetupCamera, DrawInstance, CreateLight,
# DrawLightInstance and dxvk_RegisterD3D9Device - i.e. describing a scene to Remix directly
# instead of faking fixed-function draws or relying on vertex capture.
exposeRemixApi = True
