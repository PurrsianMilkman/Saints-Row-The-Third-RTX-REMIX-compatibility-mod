; sr3-rtx - fixed-function conversion for RTX Remix
;
; Ported from BRAGme/sr2-rtx-remix-proxy. Every draw the game submits through shaders is
; re-issued as fixed function so Remix can path-trace it directly instead of reconstructing
; geometry from vertex-shader output. See docs/sr2-fork.md.
;
; A SETTING HERE IS A HYPOTHESIS THAT IS NOT YET SETTLED. Once measured, a behaviour moves into
; the code with the measurement recorded beside it, and its switch is deleted. A switch nobody
; varies is a switch nobody re-checks, and stale switches interacting is what made the pre-fork
; build unmaintainable - it carried about twenty of them.
;
; Removed on 2026-08-17, with the evidence, so nobody re-adds them:
;   skipDepthOnly   inert. COLORWRITEENABLE == 0 occurs ZERO times in a complete frame dump. It
;                   also read that state through a helper that returns 0 on a failed query, so
;                   its only possible failure mode was skipping the entire world.
;   finiteFar       inert on SR3. Its projection is near=0.15 far=5000 (Q=1.00003), perfectly
;                   ordinary; the substitution counter read 0 on every run. Real on SR2, not here.
;   startupDelayMs  always 0.
;   skipComposite   harmful. The composite quad is the only draw that writes the back buffer, so
;                   dropping it left stale content there and the image "froze" at a healthy 56fps.
;   perspectiveOnly } settled true, now constants in the source
;   mainCameraOnly  }
;   uvScaleDenom    settled at 1024, read out of the shader disassembly

[sr3-rtx]

; ---------------------------------------------------------------- conversion

; Master switch. 0 makes the shim a passive observer: still logs, still injects lights, converts
; nothing. This is the A/B for the question "is our converted geometry reaching the path tracer
; at all?" - worth running whenever a change seems to make no difference.
;
; ANSWERED, 2026-08-21. With ffp=0 the world is RASTERISED and there is no path tracing at all -
; Remix's capture button does nothing, because there is no ray-traced scene to capture.
;
; So the fixed-function conversion IS the path-traced world. The vertex-captured shader draws were
; never the world; they are a SECOND, shader-derived copy of everything the shim passes through or
; marks - all 2,765 prepass draws a frame among them. That is the magenta and the head z-fighting.
;
; It also disposes of the run-65 theory that converted draws were being rasterised into the game's
; HDR target and never reaching the path tracer. They reach it; they are all of it.
ffp=1

; Convert skinned meshes (characters, pedestrians) by CPU skinning them before submission.
;
; The old note here said objTM "means nothing" for skinned meshes. That was wrong, and the
; disassembly of debug_diffuse_only_c.fxo_pc says so plainly: objTM at c32 is applied AFTER the
; bone blend. So skinning happens in OBJECT space and the existing WORLD/VIEW/PROJECTION path
; places the result with no changes at all.
;
; Why it is needed: the skinned vertex buffer is STATIC and holds the bind pose (measured usage
; 0x8 = WRITEONLY, no DYNAMIC bit). All animation lives in the c52 bone palette, which is vertex
; shader constants - invisible to Remix. So the geometry Remix reconstructs never changes and
; characters freeze while the converted world moves. Skinning on the CPU makes the positions we
; submit actually animate.
;
; A skinned draw that cannot be skinned falls back to passing through, NOT to converting: fixed
; function cannot read a bone palette, so converting without skinning would render a rigid
; T-posed statue - visibly worse than the stutter it replaced.
convertSkinned=1

; Hide SR3's geometry prepass. It has TWO shapes, and both are hidden by this switch:
;
;   1. A pixel shader that samples NOTHING AT ALL. Caught by the state probe submitting the
;      identical mesh twice: once with no samplers, once with Diffuse_MapSampler.
;   2. A pixel shader that samples the IR stipple pattern and names NO colour map. Found
;      2026-08-18 by disassembly: ir_bb_tod_window_bs.fxo_pc shader [6] samples Normal_Map at s0
;      and IR_Stipple_Pattern_2D at s11, decodes a tangent-space normal and writes specular power
;      with no colour anywhere, while shader [8] of the SAME FILE is the material pass carrying
;      Diffuse_Map, Decal_Map, Specular_Map, IR_LBuffer and Tint_color. 415 pixel shaders match
;      shape 2 (236 stipple alone, 179 stipple + Normal_Map).
;
; Shape 2 used to be CONVERTED with stage 0 unbound, i.e. rendered WHITE - a white copy of the
; world sitting on the correctly textured material pass. That is where "most surfaces are white"
; came from; every rank-0 converted draw in the frame dump was one of these.
;
; The precision still matters. An earlier version keyed on "no COLOUR sampler" alone, which also
; matches real materials whose only texture is a normal map, and skipped ~2,400 draws a frame of
; genuine world geometry including 17,601-vertex terrain. The stipple is what makes it specific.
skipUntextured=1

; Mark the auxiliary-camera pass so Remix drops it. Measured 2026-08-18: 415 draws a frame, 395
; sampling Diffuse_Map, all but three into ONE 512x288 A16B16G16R16F target - 16:9 at 0.4 scale,
; so a reflection or secondary-view render, not a shadow map (those are square). Remix
; reconstructs every one, which is a second copy of the world drawn from somewhere the player is
; not looking.
;
; OFF until the post chain is confirmed hidden. Marking rebinds stage 0, which changes what the
; game renders into that reflection buffer - harmless only if the game's rasterised output can no
; longer be seen. Path tracing computes reflections itself, so the game's are redundant.
;
; Turned ON 2026-08-18: the overlay is confirmed gone, and this pass is now the largest
; population Remix still reconstructs (506 draws/frame). The user's remaining artefact is
; "shapes around me... like the egg", which is a claim about position, and a secondary view
; rebuilt against the main camera's matrices is a warped copy of the world centred near the
; player. The log now reports where that camera actually sits, so the next run either
; confirms this or rules it out instead of being argued about.
markAuxCamera=1

; Clear the back buffer once a frame, ourselves.
;
; Session 14 established that the composite quad is the ONLY draw that writes the back buffer, and
; that dropping it froze the image. We now mark that quad and Remix's ignore list drops it - so
; nothing writes the back buffer at all. Where path-traced geometry covers the screen that is
; invisible; where it does not, the stale contents show through, which is the "hall of mirrors"
; effect reported while flying.
;
; It also corrects a session 15 claim: "ignore removes a draw from the ray-traced scene while the
; game's rasterisation survives" was inferred from the engine's draw count not collapsing, but
; that count depends on the engine reading back the PREPASS, not on the back buffer. The artefact
; is evidence that the rasterisation is dropped too.
;
; One Clear per frame, issued the first time a draw targets the back buffer - before Remix
; composites anything. Black, so a region with genuinely nothing in it reads as empty.
clearBackBuffer=1

; Skip passes whose view handedness differs from the frame's first camera - reflections. NOT an
; absolute "determinant < 0" test: whether SR3's view matrix preserves handedness is unverified,
; and an absolute test would reject every draw in the game if it does not.
skipMirrored=1

; What to do with real geometry that must not reach the path tracer: the prepass and the
; auxiliary cameras.
;
;   0 = pass through. Remix captures it; the world appears duplicated (the z-fighting). Measured
;       at 877 prepass draws a frame against 314 converted ones - a whole second copy.
;   1 = orthographic demote. Remix classifies it UI - but UI is RASTERISED AS A 2D OVERLAY, so
;       the shape stays visible with a changed transform.
;   2 = skip the draw. Removes it from Remix, but MEASURED TO BREAK THE ENGINE: the game's own
;       draw count collapsed from 2,615 to 593 per frame and the image froze, because the engine
;       reads that pass back - GPU occlusion culling is the likely consumer. The general rule it
;       taught: a draw whose RESULT the engine reads can never be skipped, only hidden.
;   3 = bind our own 4x4 marker texture to stage 0 for the draw. The prepass pixel shaders sample
;       NOTHING, so this cannot change one pixel the game renders or one bit it reads back - but
;       Remix reads stage 0 as albedo, so ONE hash then names exactly this pass and can be put in
;       rtx.ignoreTextures. Only draws whose shader declares no sampler are marked; the other
;       hidden classes (light volumes, auxiliary cameras, mirrored passes) fall back to 0 and are
;       counted as "refused" in the log.
;
; Mode 3 needs its hash tagged once: run the game, look for the geometry that is now BRIGHT
; MAGENTA (that is the marker rendering, and it confirms the duplicate is the prepass), tag it in
; the Remix menu Alt+X -> Game Setup, tick "Ignore", and Save. Until that is done mode 3 looks
; exactly like mode 0 apart from the colour.
hiddenPassMode=2

; What to do with screen-space quads (vertex shaders that never reference projTM).
;
;   0 = pass through. Remix reconstructs them and rasterises them over the path-traced world.
;   1 = orthographic demote. Remix treats them as UI - but UI is RASTERISED AS AN OVERLAY, so
;       this does not hide anything.
;   2 = mark the ones that sample a RENDER TARGET, so Remix's ignore list drops them.
;
; Measured 2026-08-18 from a complete frame dump: 49 screen-space draws, every one passed through,
; and together they are the entire deferred-resolve and post chain - the IR_GBuffer_Lighting and
; IR_GBuffer_Depth resolves, a 512x512 blur, the auto-exposure reduction (320x180 -> 64x64 ->
; 16x16 -> 4x4 -> 1x1), the colour LUT, and the two draws that write the back buffer. THAT is the
; "partial rasterised image over the path-traced world".
;
; Mode 2's separator is what the quad SAMPLES. It marks a quad when stage 0 is a render target we
; watched the game create, OR stage 0 is null (the IR_GBuffer_Depth resolves bind nothing), OR the
; shader names no colour sampler at all - that last case catches the depth resolve, whose source
; comes from CreateDepthStencilSurface and so never passes through our CreateTexture hook.
;
; A quad that DOES name a colour sampler is left alone: the HUD, a light cookie (Diffuse_Map_1
; into the 400x288 light buffers), or other authored 2D content. rtx.uiTextures is the mechanism
; for those. If a HUD element ever vanishes, it is one whose shader names no colour sampler -
; set this back to 1 or 0 and say so.
;
; The screen-space test runs BEFORE the light-volume test, and that ordering matters: 21 fullscreen
; quads a frame resolving IR_GBuffer_Depth/Lighting carry IR_Light_* constants, so the light-volume
; test used to claim them and refuse to mark them. They were the residual overlay.
screenSpaceMode=2

; Hide the inferred-lighting light volumes. Safe: EmitLight reads each light's parameters from
; the shadowed pixel-shader constants before the draw, so the light is injected whether or not
; the volume mesh is drawn. Follows hiddenPassMode.
hideLightVolumes=1

; ---------------------------------------------------------------- materials

; Convert SHORT2 texture coordinates to a float2 stream so RTX Remix can read them.
;
; THIS IS THE CAUSE OF "THE WORLD IS NOT TEXTURED", and it was never on our side of the bridge.
; From Remix's own log (rtx-remix/logs/remix-dxvk.log), with the VkFormat name table inside
; Remix's own binary used to decode the number:
;
;     warn: [rtx-interleaver] Unsupported texcoord buffer format (80), skipping texcoord
;
; VkFormat 80 is VK_FORMAT_R16G16_SSCALED - what DXVK maps D3DDECLTYPE_SHORT2 to. Every world
; vertex format in SR3 stores texture coordinates as SHORT2, so Remix DISCARDS them and the
; geometry is path traced with no UVs at all. Every surface then samples a single texel and
; renders as flat material colour: "maybe textures are loaded but the path tracer shows the
; material color".
;
; Re-declaring the same bytes as SHORT2N was tried first, because it costs nothing. Remix
; answered in the same words with a different number - format 78, VK_FORMAT_R16G16_SNORM. The
; interleaver wants real floats and no reinterpretation of those four bytes can produce them.
;
; So the coordinates are CONVERTED into a float2 buffer of our own, bound as a second vertex
; stream, with a clone of the game's declaration whose TEXCOORD0 points at it. Position, normal
; and every other element still come from the game's own buffers - the geometry is untouched and
; only the coordinates change.
;
; float2 is not a third guess. It is the only texcoord format known to work on this exact path,
; and it is known from the only two textured populations in the game today: characters, whose
; vertices this shim already rebuilds into a float2 FVF for skinning, and foliage, drawn from a
; game instance stream whose stream 0 is a single float2 TEXCOORD. Those two being the textured
; ones, and every SHORT2 surface being flat, is what identified the bug.
;
; Converted WHOLE BUFFER AT A TIME and cached on the source buffer, not per draw: ~450 draws a
; frame need this and most of them come out of a handful of large shared buffers. Converting per
; draw would rewrite the same city block's coordinates hundreds of times a frame. Whole-buffer
; conversion also makes the stream offset trivial - our entry i is source vertex i, so any draw
; binds it unchanged at any minIndex.
;
; The cache holds a reference on each source buffer, because its key is that buffer's address and
; a recycled address would otherwise hand a later mesh these coordinates. A reference cannot stop
; the game REFILLING a static buffer, so the vertex-buffer Lock hook drops the conversion whenever
; the game write-locks one.
;
; Values are stored RAW - the short widened to float, unscaled. The uv texture matrix already
; carries the 1/1024 and the per-material tiling, and that is the same convention the skinned path
; uses. Two owners for one scale is how the two come to disagree.
;
; Watch in the log: "SHORT2 texcoords converted to a float2 stream". Failures are counted
; separately for the conversion and the declaration clone. If the world is still flat and Remix
; still reports an unsupported texcoord format, read the number - it names what it rejected.
remixShortUV=1

; Reset the stream frequency on converted draws that carry a single instance.
;
; Almost every converted world draw is a D3D9 INSTANCED draw - 377 of 378 in the run that exposed
; this - and every one carries exactly ONE instance, which the classifier already requires before
; it will convert at all. The instancing conveys nothing by then: the per-instance transform has
; already been read out of the stream and applied as the world matrix, and a single copy is drawn
; either way.
;
; What it does convey is instancing state that Remix has to cope with on a fixed-function draw.
; While rtx.useVertexCapture was on, the shader copies of the same geometry filled the scene and
; hid whatever Remix made of ours. With vertex capture off - which is what finally removed the
; magenta - our converted draws ARE the scene, and the report is that they "enter the view frustum
; and get deleted right after".
;
; Resetting the frequency makes them ordinary indexed draws, which is what they already are in
; every respect that matters here. The exact prior setting is restored after the draw, because the
; engine's own draws depend on it.
;
; MEASURED: the popping persisted with this on, so instancing is NOT the cause. Back to 0 rather
; than left in as a change that did nothing - a shim this size cannot afford settings kept because
; they are already there.
deinstanceConverted=0

; One pass over SR3's customisable-clothing materials, ahead of generating their textures.
;
; This family is why character clothing colour has never been right: it builds base colour PER
; TEXEL from a mask and three constants, and Remix never runs the game's pixel shaders. Read from
; ir_sr3npcclothfull_c.fxo_pc shader [8], not inferred:
;
;     texld r3, v0, s0                   ; Pattern_Map
;     sum  = p.r + p.g + p.b
;     dev  = |p.r-sum/3| + |p.g-sum/3| + |p.b-sum/3|
;     test = sum - (dev*165.016495 + 256)/255
;     test <  0 -> albedo = p.r^2.2*Diffuse_Color_a + p.g^2.2*Diffuse_Color_b + p.b^2.2*Diffuse_Color_c
;     test >= 0 -> albedo = saturate((p - 0.372549) * 1.59375) ^ 2.2
;     mul oC0, r1, c37                   ; whole result * Tint_color
;
; The channels are gamma-2.2 WEIGHTS, not plain masks, and a selector switches whole texels to a
; desaturated branch - which is how trim and skin escape the three customisation colours. The
; earlier tintFallbackAlbedo attempt failed because it modulated the whole pattern by the tint,
; multiplying a mask by a colour the shader never multiplies.
;
; 34 shader entries across 19 files carry the full set: the ir_*sr3pccloth* / ir_*sr3npccloth*
; family, player and NPC alike, including the alpha-test variants.
;
; The probe answers the two things that decide whether the generator can be built at all, neither
; of which is in the shaders:
;   1. Can the Pattern_Map be READ? These textures are D3DPOOL_DEFAULT and D3D9 does not promise
;      a lock on those. If it fails, the source has to be snooped from UpdateTexture at upload.
;   2. How many DISTINCT (pattern, a, b, c, tint) combinations occur? The generator caches one
;      texture per combination, which is only affordable if that number is small.
clothProbe=1

; Build clothing albedo per outfit from the pattern mask and the player's chosen colours.
;
; The probe answered both of its questions on 2026-08-20, and both answers made this cheap:
;   - the Pattern_Map read-lock SUCCEEDS on D3DPOOL_DEFAULT under DXVK (8 of 8, none failed), so
;     no UpdateTexture snooping is needed;
;   - every pattern measured 32x32 DXT1. 1024 texels. A whole outfit generates in microseconds
;     and costs 4 KB, so the one-per-frame amortisation and worker thread that were being
;     designed for are both unnecessary.
;
; The gamma is exact rather than approximated: every input to pow(x, 2.2) is an 8-bit channel, so
; a 256-entry table covers the whole domain and no pow runs in the loop.
;
; Tint_color is deliberately NOT applied. It measured as (5.0, 5.0, 5.0) on every draw - an
; exposure multiplier for the inferred-lighting pipeline, applied after lighting, not a material
; colour. Baking a factor of five into an 8-bit texture would clip every channel to white. This is
; the same mistake tintFallbackAlbedo made in a different form.
;
; SCOPE: the 20 shader entries where the pattern IS the albedo - the NPC clothing family. The 14
; PLAYER entries (ir_at_sr3pccloth_*) are a DIFFERENT recipe:
;
;     layer  = lerp(lerp(lerp(1, Diffuse_Color_c^2.2, p.b), Diffuse_Color_b^2.2, p.g),
;                                                           Diffuse_Color_a^2.2, p.r)
;     albedo = Diffuse_Map * Diffuse_Color * layer
;
; a layered mask over a full-resolution Diffuse_Map, with the pattern on a SECOND texture
; coordinate set (v1, with ClampU1/ClampV1). Folding those into one texture is only possible if
; TEXCOORD1 is a fixed transform of TEXCOORD0, which is a question about the vertex data rather
; than the shaders - so clothProbe now reports the texcoord sets for those draws.
;
; Each generated texture has a stable hash of its own per outfit, which is what makes it
; replaceable later.
generateCloth=1

; Write the first three generated outfits and their decoded source patterns out as raw RGB, into
; the game directory as cloth-pattern-N-WxH.raw and cloth-result-N-WxH.raw.
;
; Turned on 2026-08-20 for one question that argument could not settle: single-colour garments come
; out correct and multi-colour ones do not. That separates two candidates - the DXT decode
; producing wrong texels, or the channel-to-colour mapping being wrong - and both are visible
; immediately in the pixels while neither is visible in any counter.
;
; Raw rather than PNG on purpose: no encoder belongs in the shim, and the dimensions are already in
; the filename. Off by default; it writes files into the game directory.
clothDump=0

; Write every named texture stage of the first 8 skinned materials out as raw RGB, into the game
; directory as chartex-N-sM-<SamplerName>-WxH.raw.
;
; Turned on 2026-08-20 for hair and skin. The constants ruled themselves out - every character
; colour constant measured (1,1,1) and Tint_color (5,5,5) - so the colour is in a TEXTURE, and the
; sampler names do not say which. The hair material binds a 256x256 Diffuse_Map as albedo while a
; 512x512 Dob_Map sits beside it at s0, and both are plausible from the name alone.
;
; Dumping and looking is what settled the clothing question in one run after argument had failed
; twice, so it is the first move here rather than the last.
charTexDump=0

; Key that re-arms the frame dump and the shape probe. Default 0x78 = F9; 0 disables.
;
; Both dumps used to fire ONCE, automatically, on the first frame with enough draws to count as
; being in the world - a second or two after loading, wherever the camera happened to point. Every
; character problem in this project has been diagnosed from whatever that arbitrary frame caught,
; and it has now twice failed to catch the thing being looked at: "the capture did not capture it
; and did not capture the npc with proper textures".
;
; Press the key while the problem is on screen and the NEXT frame is captured. Each press writes
; its own numbered pair, sr3-rtx-frame-N.log and sr3-rtx-shapes-N.log, so several can be taken in
; one session and compared; the first automatic capture keeps the original unnumbered names.
;
; Polled in Present, between frames, so a capture never begins with a frame already half recorded.
captureKey=0x78

; Refuse to read a bone palette for a draw whose VERTEX SHADER declares no BLENDINDICES input.
; 1 = the mesh keeps its bind pose and objTM places it (what the game's own shader does).
; 0 = the old behaviour: fall back to c52 and pose it from whatever is there.
;
; Found by disassembly 2026-08-26, not by testing. The car body and car glass ship in two
; variants over the SAME mesh and the SAME vertex declaration:
;
;     ir_sr3cardiffusespec_g_v   dcl_position v0 / dcl_normal v1 / dcl_blendindices v2
;                                mul r2.x, c0.z, v2.x ; mova a0.x, r2.x
;                                dp4 r0.x, c52[a0.x], r1        <- bone, THEN objTM
;
;     ir_sr3cardiffusespec_g_s   dcl_position v0 / dcl_normal v1        <- no blendindices
;                                dp4 r1.x, c32, r0              <- objTM alone
;
; The shim decided "skinned" from the vertex DECLARATION, which is shared between the two and
; still carries BLENDINDICES. For the static variant the shader declares no palette, boneReg came
; back -1, and the code fell back to c52 - so a detached bumper was posed by whatever palette the
; last CHARACTER draw left in the register file. Its physics body never moved, because nothing was
; wrong with the object: only our copy of its geometry was being bent onto somebody's skeleton.
;
; Verified safe across all 1,693 shader files before shipping: 623 declare neither blendindices
; nor Bone_weights (the static variants), 110 declare both without blendweight (single-bone
; vehicles), 111 declare all three (four-bone characters), and ZERO declare Bone_weights without
; blendindices - so this gate can never stop skinning a shader that genuinely skins.
;
; Falsifier in the frame report:
;     NO BONE DECL: N draws/frame whose vertex shader reads no BLENDINDICES
; If N is 0, no draw ever took the fallback and this fixed nothing. Set to 0 to bring the drift
; back on demand - that is the A/B, and it needs no rebuild.
skinRequireBoneDecl=1

; Size in MB of the ring the CPU-skinned vertices are written into (4-256, was fixed at 8).
;
; The write position is forced to firstVertex*stride so the game index buffer can be reused
; verbatim, which means the ring is consumed much faster than the vertex count suggests - each
; draw skips forward to its own index base. When it fills, the wrap issues D3DLOCK_DISCARD over
; the WHOLE buffer and orphans the allocation.
;
; That is the only shared mutable memory in the skinned path, and how often it recycles scales
; with how much skinned geometry is on screen - the one property of the reported drift that
; nothing else has explained. Establishing 2026-08-25 that the drift needs OUR asi (absent with
; the shim disabled and Remix reconstructing the same objects) is what made this worth testing.
;
; Falsifier in the frame report:
;     SKIN RING: N MB, high water H MB, W wraps/frame, D discards/frame
; If wraps/frame is 0 at this size, the ring is never recycled mid-frame and this is not the
; cause. High water says how large it would need to be for that to hold.
;
; 2026-08-26, run at 64: wraps went to 0.00/frame with a high water of 15.24 MB - so at the
; old 8 MB the ring WAS recycling mid-frame, and the hypothesis was live rather than idle.
; But 64 MB made the game unplayable in a busy street: a whole-buffer DISCARD renames the
; ENTIRE allocation once a frame regardless of how little of it we write, so its price is
; set by this number and not by the vertex count. 24 clears the measured 15.24 MB by 57%,
; which keeps wraps at 0 while asking the driver for a third of the memory per frame.
; SKIN RING LOCK in the same report now times that lock directly, so the next run says
; whether the size costs frames instead of leaving it to be inferred from a sawtooth.
skinRingMB=24

; Answer the engine's GPU occlusion queries "fully visible" (0 = leave them alone).
;
; SR3 does its own occlusion culling: it draws a bounding volume, wraps it in a
; D3DQUERYTYPE_OCCLUSION query, reads the visible-pixel count back, and stops submitting any
; object whose count came back zero. That readback is the rule recorded against hiddenPassMode=2 -
; "a draw whose RESULT the engine reads can never be skipped, only hidden".
;
; rtx.useVertexCapture = False is a global skip of every shader draw, the depth prepass included,
; so the depth buffer those queries test against is never written and every query answers zero.
; Measured 2026-08-23 from two frame dumps taken in the same area (camera y~147 both times):
;
;     capture ON   5330 draws/frame   (MARK 3930, CONVERT 1260, PASS 140)
;     capture OFF  1426 draws/frame   (MARK 1182, CONVERT  220, PASS  24)
;
; A 73% collapse in the GAME's own submission, against the 77% collapse recorded for
; hiddenPassMode=2 - the same failure. It is the whole "objects enter the frustum and are dropped"
; symptom: the game asks whether an object is visible, is told no, and stops drawing it. Objects
; clipped by a frustum plane survive because an occlusion test on a clipped bounding box is
; unreliable and engines skip the query for those, which is exactly why only the periphery
; rendered.
;
; The fix needs nothing from Remix. Queries are D3D9 objects and we are the D3D9 layer.
;
; ONLY D3DQUERYTYPE_OCCLUSION is touched - D3DQUERYTYPE_EVENT is a frame-pacing fence and lying
; about one of those would break synchronisation rather than culling. The real query is never
; drained: calling through can carry D3DGETDATA_FLUSH, which stalls on the GPU across the
; 32-to-64-bit bridge, the same mistake that made the instance-buffer read lock present as a
; frame-rate collapse.
;
; Expect MORE geometry submitted than the game would normally draw, and a frame-rate cost with it.
; That is the intended trade while functionality is the priority.
;
; The frame report carries its own falsifier:
;     occlusion queries: N read back/frame, M answered VISIBLE/frame
; "read back" is counted even with this off, so one run with it off measures the baseline. On with
; M = 0 means the hook never fired and nothing observed can be credited to it.
forceOcclusionVisible=1

; Drop bone influences whose matrix belongs to a DIFFERENT object (0 = blend them anyway).
;
; The c52 bone palette is shadowed shader constants, and that shadow persists across draws. A
; bone this object never wrote still holds the PREVIOUS object's matrix, so a mesh that reads one
; is posed partly by its own skeleton and partly by whatever was drawn before it.
;
; Measured 2026-08-25, per-bone provenance over a frame with NPCs and a knocked-off bumper:
;
;     111.4 clean/frame, 5.0 MIXED palettes/frame, 0.0 reading a bone nothing wrote this frame
;     worst spread 276 draws
;
; One object's palette arrives as a burst of consecutive calls sharing a draw index or within a
; draw or two of it. 276 draws apart is two objects. 5 of 116 skinned draws is 4.3% - the size of
; "a few car windows and a detached bumper", which is exactly what was reported moving around in
; sync with player and NPC animation.
;
; An earlier counter (BONE PALETTE ... BEYOND the upload's reach) measured this WRONG: it recorded
; only the last SetVertexShaderConstantF call, so a palette written across several calls looked
; one bone deep - "smallest upload seen 1 bones". Do not act on that line; the per-bone
; BONE PROVENANCE line supersedes it.
;
; Surviving weights are renormalised (the blend divides by the weight sum), so dropping an
; influence redistributes it across this object's own bones rather than shrinking the vertex
; toward the origin. A vertex that loses every influence stays in its bind pose, attached to its
; own object instead of teleporting onto someone else.
;
; Falsifiers in the frame report:
;     stale-bone rejection ON: N influences dropped/frame, N vertices left in bind pose/frame
; ON with 0 dropped means the filter never fired. A large bind-pose count means it is too
; aggressive and is flattening meshes rather than repairing them.
rejectStaleBones=0

; Ignore bone influences that lie outside this object's own palette upload (0 = use them anyway).
;
; Every palette upload in SR3 starts at c52 and runs as far as that object's skeleton needs -
; verified from the upload history, where lengths of 4, 5, 9, 20, 48, 51 and 58 bones all began
; at c52. The shadow therefore always holds a PREFIX belonging to the object being drawn and a
; TAIL left over from previous ones. A vertex bound to a bone in that tail is posed by another
; object entirely, usually a character, and follows its animation.
;
; A car draw is the whole car, with each vertex bound to its own part's bone - 17 to 18 bones on
; the meshes measured. So only SOME vertices are affected, which is why the result is a car that
; both drifts and STRETCHES: the bound vertices are dragged away and the rest stay put.
;
; The test is the upload's STAMP, not its length. Consecutive constant writes with no draw
; between them share a draw index, so a multi-call upload carries one stamp and is handled by
; construction. An earlier attempt compared against the last call's length instead and reported
; 'smallest upload seen 1 bones' - the measurement being wrong rather than the game.
;
; A rejected influence contributes nothing, so the vertex falls through to its bind pose and
; objTM places it - attached to its own car rather than teleported onto a person.
;
; Falsifiers in the frame report:
;     BONE CLAMP ON: N verts/frame bound to a bone OUTSIDE this object's own palette upload
; ON with 0 means it never fired. A percentage near 100 means it is rejecting nearly everything
; and flattening meshes - revert with clampBonesToUpload=0, no rebuild needed.
clampBonesToUpload=0

; Pose only by a bone palette published in this draw's OWN setup (0 = use whatever is resident).
;
; The c52 palette is shadowed shader constants and persists across draw setups. A draw whose own
; setup uploaded no palette silently inherits the previous object's bones - and which object that
; is depends on draw order, which depends on what is on screen.
;
; Measured 2026-08-25, and this is the drift itself rather than an inference about it: a mesh
; whose objTM was IDENTICAL between two frames moved 0.750 units, because bone[0]'s translation
; went from (0.132, -0.939, -0.360) to (0.000, 0.000, 0.000). Real position static, rendered
; position moving - exactly as reported.
;
; This is the same failure the code already guards against for objTM: a shader that declares
; objTM without uploading inherits whatever was left in c32, very often the player character's
; matrix. The remedy is the same one applied to the palette: a setup that published no palette
; gets IDENTITY bones, so objTM alone places the object.
;
; Setup boundaries come from the existing mechanism - a projTM upload following a draw - so this
; reuses the object-boundary definition that already works for objTM rather than inventing one.
;
; Falsifier in the frame report:
;     PALETTE SCOPE ON: N vertex influences/frame refused because the palette belonged to
;                       another draw setup
; ON with 0 refused means it never fired. A very large number means setups routinely rely on an
; earlier palette and this is too strict - revert with paletteSetupScope=0, no rebuild.
paletteSetupScope=0

; DIAGNOSTIC: ignore the bone palette entirely on single-bone (vehicle) draws and let objTM
; place the bind pose. Loses door swing, damage deformation and wheel spin. If cars are stable
; and correctly placed with this on, the palette is the whole problem and nothing else is.
vehicleBonesOff=0


; Scale applied to the generated clothing albedo, as a percentage.
;
; The generator was verified byte-exact against the shader on 2026-08-20: 21 distinct texel classes
; from a dumped 512x512 pattern, zero mismatches, decode and channel mapping and sRGB round trip all
; correct. So the recipe is not in question. What IS in question is the one term deliberately left
; out of it.
;
; The game computes  final = albedo * lighting * Tint_color,  with Tint_color measured at
; (5.0, 5.0, 5.0) on every clothing draw. That is an exposure factor for the inferred-lighting
; pipeline, and it cannot go into an 8-bit albedo texture without clipping. Leaving it out is
; defensible as physics - albedo should be 0..1 reflectance - but it makes these materials roughly
; five times darker IN LINEAR TERMS than the game shows them, which shifts apparent colour and not
; just brightness.
;
; Whether Remix's lighting wants the physical reflectance or something closer to the game's scaled
; value is a question about matching two lighting models, and looking at it settles it faster than
; arguing about it. 100 is unchanged behaviour; 500 applies the game's factor in full. Values above
; 100 clip the bright end, which is exactly why this is a knob to test with rather than a default.
clothAlbedoPercent=200


; Choose base colour by sampler name from the shader's constant table. Measured across every
; pixel shader in the game: stage 0 holds a Diffuse map 804 times but a NORMAL map 903 times, and
; Remix reads stage 0 as albedo - so those ~900 materials were being shaded with a tangent-space
; normal map. Ranking: Diffuse > Decal > Pattern > Blend > Grime > base > Illumination.
rankAlbedo=1

; Never treat a render-target texture as base colour. The light buffer, HDR scene buffer and
; shadow maps are generated data; binding one as albedo is what made surfaces flicker through
; unrelated images. Falls back to the largest authored texture bound anywhere - largest, not
; first, because a tiny detail map gives Remix a featureless surface it renders as a near-mirror.
excludeRTAlbedo=1

; Pin each mesh to the first texture it was drawn with, to survive SR3 evicting a wall's unique
; texture under memory pressure and rebinding a shared fallback. Keyed on vertex buffer + base
; vertex + pixel shader; without the shader in the key, one mesh drawn with several materials
; collapses onto whichever texture was seen first.
;
; THIS IS THE PRIME SUSPECT FOR THE CRASH ON FAST MOVEMENT. Until 2026-08-18 it held raw texture
; pointers with no AddRef, across exactly the streaming eviction it exists to survive - a
; use-after-free. It now holds a reference and is capped at 4,096 entries.
;
; The fix has a cost of its own that is not yet measured: a reference held is a texture the
; streamer cannot evict, so a long drive pins up to 4,096 of them. The log says "mesh albedo cache
; full" when the cap is reached. If that turns into VRAM pressure or stutter, the question to ask
; is not how to tune the cap but whether this cache should exist at all - excludeRTAlbedo already
; covers one of the two symptoms it was written for, and address recycling in the very bug above
; could account for the other. Set this to 0 to find out; it needs no build.
;
; OFF, 2026-08-19, to answer exactly that question. Four measurements put it under suspicion for
; "the world is not textured", which is a texture-SUBSTITUTION symptom and this is the only
; mechanism in the shim that substitutes textures:
;
;   1. It rewrites the albedo on 238 of 756 converted draws a frame - a third of the world.
;   2. Its key holds a raw vertex-buffer POINTER with no reference on the buffer. That is the
;      same defect already found and fixed in three other caches: the streamer frees a buffer,
;      the allocator hands the address to a different one, and the key silently now names another
;      mesh. The AddRef added in the crash fix protects the TEXTURE, not the buffer the key is
;      built from.
;   3. Even with the buffer alive, a static buffer can be re-filled. 2,217 entries with 3 full
;      flushes in one session means roughly 14,500 distinct keys were seen - the regions churn
;      heavily, so a repeated key is not evidence of a repeated mesh.
;   4. "The world is not textured" first appeared at run 36, inside the window in which the world
;      moved to fixed-function conversion and this cache was added. Before that, session 9's
;      screenshots showed brick, stonework and wood flooring rendering correctly.
;
; If the world gains its textures back with this at 0, the cache is the cause and should be
; deleted rather than re-keyed - the streaming-eviction problem it was written for has never been
; observed directly, only inferred from the restore count it produces itself.
; If nothing changes, the cache is exonerated and the cause is on Remix's side of the bridge.
cacheMeshAlbedo=0

; ---------------------------------------------------------------- lights

; Translate the engine's inferred-lighting volumes into D3D9 lights, which Remix converts into
; real ray-traced lights. Recognised by the IR_Light_* constants in each volume's pixel shader.
injectLights=1
lightScalePercent=100
lightRangePercent=100

; ---------------------------------------------------------------- diagnostics

; Write one complete frame - every draw in submission order, grouped by render target, with
; states, shader properties, the disposition applied and WHY - to sr3-rtx-frame.log. This is the
; file to read to understand the engine rather than tune numbers; the two-pass inferred-lighting
; structure was found this way.
;
; The value is how many frames to WAIT after the camera first appears. 0 disables it. It used to
; dump the first frame with a camera, which meant it sampled a loading screen: the 2026-08-18 dump
; recorded 94 converted draws where steady-state gameplay has 1,079, and its 1,302 material-pass
; pass-throughs were mostly "main camera not latched yet" rather than anything real. At ~40 fps,
; 1800 frames is about 45 seconds - long enough to be in the world and moving.
dumpFrame=1800

; One frame of world-space bounding boxes for every draw near the camera, to sr3-rtx-shapes.log.
;
; This exists because "shapes around me" has been guessed at since session 9 and attributed, in
; turn, to light volumes, decals, texture problems and the geometry prepass - each time wrongly.
; A dish, a cap and a ring are all FLAT, which an axis-aligned box measures directly: the "flat"
; column is smallest axis over largest, so a disc reads near 0.0 and a cube near 1.0. Combined
; with size, distance from the camera, the shader name and the disposition, that should name each
; shape rather than describe it.
;
; One frame only, and only draws whose bounds are under 400 units and within 300 of the camera.
; The buffer LOCK is gated by the same conditions as the report - capping only the output while
; still locking a vertex buffer on every draw is a mistake this file has already made once.
shapeProbe=1

; One log line per distinct vertex declaration, capped at 24.
logLayouts=1

; Dump every render state for draws with these exact vertex counts, up to 30 lines. Vertex count
; is a stable property of a mesh, so it picks one specific shape out of ~2,600 draws a frame.
; Empty = off. This is how the prepass/material two-pass structure was identified.
probeVerts=

; Any frame at or above this many ms writes one HITCH line partitioning where the time went:
; inside the real Present (Remix's own end-of-frame work), our end-of-frame block, our draw path,
; our other hooks, and the remainder (the game's CPU work plus bridge submission).
;
; This exists because the previous TIMING line measured only the draw path, so "frame worst
; 115 ms | shim worst 4.6 ms" was read as "the hitch is not ours" when all it established was
; "the hitch is not in DrawIndexedPrimitive". Shader and texture creation, the render-target
; hook and Present itself were outside the measurement entirely.
;
; 40 ms is ~2.3 frames at the measured 58 fps. Capped at 60 lines per run.
hitchMs=40

; One frame of skinned-draw detail: vertex declaration (which fields carry blend weights and
; indices, and how they are stored), the vertex buffer's usage flags, how much of the 64-bone
; palette at c52 is live, objTM per character, and the raw weight/index bytes of a few vertices.
;
; This is the input to the CPU skinning port. The algorithm is already known from disassembling
; debug_diffuse_only_c.fxo_pc - pos' = (SUM w_i * Bone[idx_i]) * float4(pos,1) / SUM w_i, with
; objTM applied AFTER skinning - but the STORAGE of the weights is not in the shader, and
; UBYTE4 vs UBYTE4N cannot be told apart from the disassembly because the shader normalises by
; the weight sum either way. Getting that wrong produces subtly wrong poses, not an obvious error.
;
; The objTM column doubles as the direct test of the instance-matching theory: if characters
; carry distinct translations they ARE distinguishable to Remix and the AABB change is not the
; explanation.
skinProbe=1

; One frame of the WEIGHTLESS skinned layout - BLENDINDICES present, BLENDWEIGHT absent.
;
; This is the only refusal reason this shim has ever printed, and it accounts for all 38 refused
; skinned draws a frame. A refused draw passes through, so Remix reconstructs it beside the
; skinned copy: these 38 are a measured contributor to the double draw on characters.
;
; skinProbe cannot report on them - it returns early whenever blendWeightOffset is negative,
; which is exactly this layout - so nothing has ever read these bytes. Treating the layout as
; rigid single-bone attachment (weight 1.0 on index component 0) was tried on 2026-08-19 and
; made character clothing vanish; component 0 was an assumption rather than a measurement.
;
; This transforms one bind-pose vertex by the palette slot named by EACH of the four index
; components and prints all four results, with the length of each matrix's first row. A slot
; that owns the vertex puts it near the rest of the character and has a row length near 1; a
; slot that does not puts it at the origin or at a wild coordinate. That distinguishes "the
; wrong component was chosen" from "this layout is not bone-driven at all", which is the
; question the vanishing clothes left open.
rigidSkinProbe=1

; Convert identical skinned triangles only once per frame.
;
; Twice wrong before this, both times from keying on too little:
;   1. the key omitted the INDEX range, so every material sub-range of one 7,977-vertex mesh
;      counted as a duplicate of the first - the reported "69 of 88 repeats" was an artefact;
;   2. the key omitted the POSE, so two NPCs wearing the same garment hashed identically and the
;      second lost its clothing - "npc now have components from them disappearing and coming back".
;
; The key now folds in eight bone matrices from the c52 palette alongside the geometry, which is
; what makes "the same object" actually mean the same object. Two characters differ in their
; palette; one mesh submitted twice in one frame in one pose does not. Eight bones is 96 floats
; per draw against ~94 skinned draws a frame - cheap, and enough to separate characters.
;
; Duplicates are HIDDEN, not skipped: the engine still needs them for its own buffers.
;
; SR3 submits the same character geometry several times as layered blend passes. A rasteriser
; resolves those into one surface; a path tracer receives coincident duplicate surfaces, which
; is what "there are two renders of my character" looks like. The key is buffer + vertex range +
; INDEX range + triangle count, so only genuinely identical triangles are dropped - an earlier
; version keyed on the vertex range alone and counted every legitimate material sub-range of a
; 7,977-vertex mesh as a duplicate.
;
; Duplicates are HIDDEN, not skipped: the engine still needs them for its own buffers.
dedupSkinned=0
; ON, 2026-08-20, on evidence rather than hope - and the user confirms it does NOT lose parts.
;
; Four earlier attempts merged draws that were not the same object. This time the key was analysed
; against a real frame BEFORE enabling it:
;
;   converted skinned draws in the frame                    75
;   groups the key would merge                              68
;     ...sharing one texture (safe to merge)                67
;     ...carrying DIFFERENT textures (would be WRONG)        1
;
; The one bad group was v=1080 p=499 at a single position with three different textures - three
; material layers on one head, of which two would have been dropped. So the ALBEDO went into the
; key: the fourth thing it had been missing, after the index range, the pose and the position.
;
; Exactly 5 draws a frame collapse, all but one at the player's own position, which matches the
; original report of the character being drawn twice.
;
; It does NOT fix the NPC head z-fighting. That is a different population, and no capture has yet
; caught it - which is what captureKey exists for. Refusals also reached 0 in run 56 while that
; z-fighting survived, so it is not the pass-through population either.

tintFallbackAlbedo=0

; Skin meshes whose declaration has BLENDINDICES but NO BLENDWEIGHT, treating them as rigid
; single-bone attachment (one bone, implicit weight 1.0).
;
; OFF - 2026-08-19. Turning it on took skinning refusals from 55/frame to 0, and in the same run
; "some character clothes items have vanished". Nothing else in that build touches clothing. The
; reasoning still looks sound, but so did the tint modulate and the dedup, and both were wrong.
; The likely truth is that these meshes are not bone-driven at all, so skinning them moves them
; somewhere off camera - which reads as vanishing rather than as a wrong pose.
;
; Off restores the previous behaviour: the draw is refused, passes through, and Remix reconstructs
; it. That brings the double-draw back for those items, which is the better of the two - a garment
; drawn twice is visible and wrong, a garment moved out of the world is simply gone.
skinRigidSingleBone=1
; ON again, 2026-08-20, because the reason it failed has been found and fixed.
;
; It was turned off after clothing VANISHED. The cause was not this setting: SkinAndBind was never
; passed baseVertex, so the bind pose was decoded from the WRONG WINDOW of the shared character
; buffer. Posing arbitrary geometry by a real bone matrix puts it somewhere the camera never looks,
; which is exactly what vanishing looks like. Fixed in run 50, and confirmed by heads becoming
; correct in the same run.
;
; Two measurements since also say the layout is what it appears to be: all four BLENDINDICES bytes
; are IDENTICAL on these draws, so component 0 was never a guess; and the bone palette is written
; 3-6 draws earlier with the same objTM, so it belongs to the draw rather than to a previous
; character.
;
; What this should fix: heads are rigid single-bone attachments - one bone, the neck - so they are
; refused, pass through, and Remix reconstructs them BESIDE our copy. That is the reported head
; z-fighting and its second, wrongly-textured copy. Hair is very likely the same, which would also
; explain it rendering white despite neither of its textures being white.
;
; If clothing vanishes again, this is wrong for a reason not yet found and it goes back to 0.
