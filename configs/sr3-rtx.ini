; sr3-rtx - fixed-function conversion for RTX Remix
;
; Ported from BRAGme/sr2-rtx-remix-proxy. Every draw the game submits through shaders is
; re-issued as fixed function so Remix can path-trace it directly instead of reconstructing
; geometry from vertex-shader output. See docs/sr2-fork.md.
;
; A SETTING HERE IS A HYPOTHESIS THAT IS NOT YET SETTLED. Once measured, a behaviour moves into
; the code with the measurement recorded beside it, and its switch is deleted. A switch nobody
; varies is a switch nobody re-checks, and stale switches interacting is what made the pre-fork
; build unmaintainable - it carried about twenty of them.
;
; Removed on 2026-08-17, with the evidence, so nobody re-adds them:
;   skipDepthOnly   inert. COLORWRITEENABLE == 0 occurs ZERO times in a complete frame dump. It
;                   also read that state through a helper that returns 0 on a failed query, so
;                   its only possible failure mode was skipping the entire world.
;   finiteFar       inert on SR3. Its projection is near=0.15 far=5000 (Q=1.00003), perfectly
;                   ordinary; the substitution counter read 0 on every run. Real on SR2, not here.
;   startupDelayMs  always 0.
;   skipComposite   harmful. The composite quad is the only draw that writes the back buffer, so
;                   dropping it left stale content there and the image "froze" at a healthy 56fps.
;   perspectiveOnly } settled true, now constants in the source
;   mainCameraOnly  }
;   uvScaleDenom    settled at 1024, read out of the shader disassembly

[sr3-rtx]

; ---------------------------------------------------------------- conversion

; Master switch. 0 makes the shim a passive observer: still logs, still injects lights, converts
; nothing. This is the A/B for the question "is our converted geometry reaching the path tracer
; at all?" - worth running whenever a change seems to make no difference.
;
; ANSWERED, 2026-08-21. With ffp=0 the world is RASTERISED and there is no path tracing at all -
; Remix's capture button does nothing, because there is no ray-traced scene to capture.
;
; So the fixed-function conversion IS the path-traced world. The vertex-captured shader draws were
; never the world; they are a SECOND, shader-derived copy of everything the shim passes through or
; marks - all 2,765 prepass draws a frame among them. That is the magenta and the head z-fighting.
;
; It also disposes of the run-65 theory that converted draws were being rasterised into the game's
; HDR target and never reaching the path tracer. They reach it; they are all of it.
; DIAGNOSTIC 2026-08-29, run 2: set to 0 for ONE run, then back to 1.
;
; ffp=0 is the FIRST line of Classify - every draw becomes PassThrough, so the shim is completely
; inert and the game renders itself. Nothing is converted, nothing is path-traced.
;
; Why this, and why it should have been run five builds ago: the character's two large textures
; are BOTH empty, measured with a control that passed exactly (SelfTestCopyPath read back 126.7
; of an expected 126.7 through the identical StretchRect + GetRenderTargetData path). And at
; hiddenPassMode=0, with "SKIPPED entirely 0/frame" - the shim removing NO draw from the engine
; whatsoever - the atlas was STILL empty after 580 readbacks. So nothing this shim skips is
; responsible.
;
; Every explanation left assumes the game's own characters look right, and that has never been
; checked. This checks it:
;
;   characters correctly coloured at ffp=0 -> the pixels exist, and both our read AND Remix's
;                                             copy are missing them. That is a DXVK/Remix
;                                             texture-residency problem, not a conversion bug,
;                                             and the shim cannot read around it - it has to be
;                                             attacked at the Remix/DXVK layer.
;   characters black at ffp=0              -> the content is lost before anything we do, and
;                                             every theory built on "the game draws them fine"
;                                             collapses. Not a shim bug at all.
;
; Put back to 1 afterwards.
ffp=1

; Convert skinned meshes (characters, pedestrians) by CPU skinning them before submission.
;
; The old note here said objTM "means nothing" for skinned meshes. That was wrong, and the
; disassembly of debug_diffuse_only_c.fxo_pc says so plainly: objTM at c32 is applied AFTER the
; bone blend. So skinning happens in OBJECT space and the existing WORLD/VIEW/PROJECTION path
; places the result with no changes at all.
;
; Why it is needed: the skinned vertex buffer is STATIC and holds the bind pose (measured usage
; 0x8 = WRITEONLY, no DYNAMIC bit). All animation lives in the c52 bone palette, which is vertex
; shader constants - invisible to Remix. So the geometry Remix reconstructs never changes and
; characters freeze while the converted world moves. Skinning on the CPU makes the positions we
; submit actually animate.
;
; A skinned draw that cannot be skinned falls back to passing through, NOT to converting: fixed
; function cannot read a bone palette, so converting without skinning would render a rigid
; T-posed statue - visibly worse than the stutter it replaced.
convertSkinned=1

; Hide SR3's geometry prepass. It has TWO shapes, and both are hidden by this switch:
;
;   1. A pixel shader that samples NOTHING AT ALL. Caught by the state probe submitting the
;      identical mesh twice: once with no samplers, once with Diffuse_MapSampler.
;   2. A pixel shader that samples the IR stipple pattern and names NO colour map. Found
;      2026-08-18 by disassembly: ir_bb_tod_window_bs.fxo_pc shader [6] samples Normal_Map at s0
;      and IR_Stipple_Pattern_2D at s11, decodes a tangent-space normal and writes specular power
;      with no colour anywhere, while shader [8] of the SAME FILE is the material pass carrying
;      Diffuse_Map, Decal_Map, Specular_Map, IR_LBuffer and Tint_color. 415 pixel shaders match
;      shape 2 (236 stipple alone, 179 stipple + Normal_Map).
;
; Shape 2 used to be CONVERTED with stage 0 unbound, i.e. rendered WHITE - a white copy of the
; world sitting on the correctly textured material pass. That is where "most surfaces are white"
; came from; every rank-0 converted draw in the frame dump was one of these.
;
; The precision still matters. An earlier version keyed on "no COLOUR sampler" alone, which also
; matches real materials whose only texture is a normal map, and skipped ~2,400 draws a frame of
; genuine world geometry including 17,601-vertex terrain. The stipple is what makes it specific.
skipUntextured=1

; Do not convert a draw whose RENDER TARGET cannot hold colour (fewer than 3 channels).
; 0 restores the old behaviour, which is the A/B for the doubled characters.
;
; The rule the sampler-based prepass tests could not express. A target with two channels has no
; blue and no alpha - nothing can render an albedo into it - so the draw is a prepass whatever
; its pixel shader happens to sample.
;
; Measured 2026-08-27 from an aimed frame dump, with an NPC standing in front of the player:
; SR3 submits its character prepass to a 2560x1440 D3DFMT_G16R16 target. Of 467 draws into it,
; 463 were already skipped for sampling nothing - and the 4 that survived were whole characters
; carrying Diffuse_MapSampler at rank 100, from the SAME vertex buffers at the SAME objTM as
; draws in the A16B16G16R16F material pass later in the frame. Both got converted, so Remix
; path-traced every character twice. That is the second head, and the z-fighting between them.
;
; Skipping rather than hiding is safe on this game's own terms: 463 of these draws' siblings
; already are, and the depth readback the engine actually reads is answered by the
; occlusion-query hook (forceOcclusionVisible), not by this surface.
;
; CORRECTED 2026-08-27, same day, after the first version broke the game. It asked only about
; render target slot 0. SR3 is a DEFERRED renderer and binds multiple targets: its G-buffer pass
; puts the 2-channel normal/depth buffer at slot 0 and a colour target alongside it. So "slot 0
; cannot hold colour" is a different question from "this draw writes no colour", and answering
; the wrong one hid 2,180 draws a frame - the entire city, whenever the camera pointed at it.
; The rule now fires only when NO bound slot can hold colour, which is what the principle
; actually says.
;
; Falsifier in the frame report:
;     non-colour render target (fewer than 3 channels...): N draws/frame hidden
;     of which: M draws/frame had a non-colour target at slot 0 but a COLOUR target elsewhere
; N should be small (the duplicate character prepass, ~12/frame). M is the MRT G-buffer pass that
; must never be hidden - it was ~700/frame when this rule was wrong. If N is 0 it fixed nothing.
skipNonColourTargets=1

; Do not CONVERT a draw whose PIXEL SHADER writes more than one render target. It is passed
; through to the device unchanged - NOT skipped.
; 0 restores the old behaviour - the A/B for the head texture and the head z-fighting.
;
; SR3 is a deferred renderer and draws each object twice. Disassembled 2026-08-28,
; ir_sr3npcskinfull_mc - the head:
;
;   shader[6]  mad oC0.xy, r0, c1.x, c1.x     <- the NORMAL, from Normal_Map
;              mad oC2.z, r1.x, r0.x, c12.x   <- Blend_Map, ONE scalar, into a fresnel term
;              plus oC1/oC2 data. NO colour anywhere.
;   shader[8]  mul oC0, r2, c37               <- Tint_color: the real material pass
;              samples Diffuse_Map, Sphere_Map_1/2, IR_LBuffer
;
; The albedo ranker scores Blend_Map at 70, so the G-buffer pass was handed to Remix with a
; SPECULAR MASK as its base colour - a correctly placed head wearing the wrong texture, drawn on
; top of the correct material copy. That is the wrong texture and the z-fighting together.
;
; Sampling a colour map is NOT evidence against this. ir_at_bbsimple1_c[6] samples Diffuse_Map
; and then overwrites the result with the normal map before using it - a dead load. Only the
; OUTPUTS say what a pass produces. Across the game: 1,343 pixel shaders write three render
; targets, 1,880 write one.
;
; Measured before shipping, which the two previous attempts at this were not:
;     399.7 G-buffer draws/frame, of which existing rules already hide all but 8.0
;     271.4 single-target draws converted
; So this removes 8 and keeps 271. The first attempt keyed on render-target slot 0 instead and
; hid 707 draws a frame - the entire city - because SR3 binds the 2-channel normal buffer at
; slot 0 for the MRT G-buffer pass alongside a colour target.
;
; PASS-THROUGH, NOT HIDDEN, and that distinction cost a run. The first version returned
; HiddenDisp() from the top of Classify, which with hiddenPassMode=2 means SKIP - 693 draws a
; frame never reached the device, the game's G-buffer was never filled, and the material pass
; reads it back through IR_GBuffer_DSF_DataSampler and IR_LBufferSampler. The world rendered
; black except where nothing deferred was on screen. The rule it broke is written above
; hiddenPassMode in this file: A DRAW WHOSE RESULT THE ENGINE READS CAN NEVER BE SKIPPED, ONLY
; HIDDEN.
;
; It now runs at the END of Classify, so every earlier rule has already had its say: draws those
; rules skip are still skipped, and only the handful that would otherwise have been CONVERTED
; reach it.
;
; Falsifier in the frame report:
;     DEFERRED G-BUFFER PASS ...: N draws/frame, of which M/frame are CONVERTED
;     ...of which H draws/frame passed through instead of converted
; H should land near 8/frame. Hundreds means it is running too early again. If H is ~0 nothing
; took this path. If the world goes black, this is skipping rather than passing through.
; NARROWED to SKINNED draws only, 2026-08-28, after the unconditional version turned the world
; black twice. SR3's visible world geometry IS the G-buffer pass: the frame dump caught the
; unconditional rule passing through `v=17601 Diffuse_MapSampler` terrain and every large
; instanced mesh - 9 draws a frame, but the 9 that matter.
;
; Terrain's G-buffer shader (ir_bbterrain1_s[5]) is structurally identical to the head's - writes
; normals to oC0.xy, data to oC1/oC2, and its Blend_Map sample is dead. So "this pass produces no
; colour" is true of both and does NOT separate them. Two things do:
;   * what the game BINDS - on a world draw the texture at that stage is the object's real colour
;     map, which is why converting terrain from this pass looks right; on a character draw it is a
;     specular mask, which is a head wearing the wrong texture;
;   * whether a material-pass copy EXISTS - characters have one, terrain's only converted copy is
;     this pass.
; Skinned is the property that tracks both.
;
; Falsifier in the frame report:
;     ...of which H SKINNED draws/frame passed through instead of converted
; H should be small and character-shaped. If the world goes black again the gate is too wide; if
; the head texture is unchanged, H is 0 and nothing took this path.
skipDeferredGBuffer=1

; Mark the auxiliary-camera pass so Remix drops it. Measured 2026-08-18: 415 draws a frame, 395
; sampling Diffuse_Map, all but three into ONE 512x288 A16B16G16R16F target - 16:9 at 0.4 scale,
; so a reflection or secondary-view render, not a shadow map (those are square). Remix
; reconstructs every one, which is a second copy of the world drawn from somewhere the player is
; not looking.
;
; OFF until the post chain is confirmed hidden. Marking rebinds stage 0, which changes what the
; game renders into that reflection buffer - harmless only if the game's rasterised output can no
; longer be seen. Path tracing computes reflections itself, so the game's are redundant.
;
; Turned ON 2026-08-18: the overlay is confirmed gone, and this pass is now the largest
; population Remix still reconstructs (506 draws/frame). The user's remaining artefact is
; "shapes around me... like the egg", which is a claim about position, and a secondary view
; rebuilt against the main camera's matrices is a warped copy of the world centred near the
; player. The log now reports where that camera actually sits, so the next run either
; confirms this or rules it out instead of being argued about.
;
; INERT under the live configuration. This selects markSafe, which only matters to
; HiddenDisp's default branch (Disp::Mark) - and hiddenPassMode=2 below returns Disp::Skip
; before markSafe is ever examined. It is mode-3-only, and mode 3 is retired (see the note
; above hiddenPassMode). Left on because it is harmless, not because it does anything.
markAuxCamera=1

; Clear the back buffer once a frame, ourselves.
;
; Session 14 established that the composite quad is the ONLY draw that writes the back buffer, and
; that dropping it froze the image. We now mark that quad and Remix's ignore list drops it - so
; nothing writes the back buffer at all. Where path-traced geometry covers the screen that is
; invisible; where it does not, the stale contents show through, which is the "hall of mirrors"
; effect reported while flying.
;
; It also corrects a session 15 claim: "ignore removes a draw from the ray-traced scene while the
; game's rasterisation survives" was inferred from the engine's draw count not collapsing, but
; that count depends on the engine reading back the PREPASS, not on the back buffer. The artefact
; is evidence that the rasterisation is dropped too.
;
; One Clear per frame, issued the first time a draw targets the back buffer - before Remix
; composites anything. Black, so a region with genuinely nothing in it reads as empty.
clearBackBuffer=1

; Skip passes whose view handedness differs from the frame's first camera - reflections. NOT an
; absolute "determinant < 0" test: whether SR3's view matrix preserves handedness is unverified,
; and an absolute test would reject every draw in the game if it does not.
skipMirrored=1

; THE LOST CAMERA (2026-09-21): at some angles the path tracing STOPPED and the raster frame was left.
; The shim adopted the FIRST convertible draw camera as the frame main camera, and at those angles
; that was the 512x288 water-reflection pass: 16:9 like the screen, but MIRRORED below the water line.
; Every real-camera draw was then refused as auxiliary: 0 converted draws, so Remix got no camera and
; path traced nothing. At 1 a camera is only adopted if it draws into the screen-sized target and is
; not mirrored. Set to 0 to restore the old first-draw-wins behaviour for an A/B.
mainCameraScreenSizedOnly=1

; What to do with real geometry that must not reach the path tracer: the prepass and the
; auxiliary cameras.
;
;   0 = pass through. Remix captures it; the world appears duplicated (the z-fighting). Measured
;       at 877 prepass draws a frame against 314 converted ones - a whole second copy.
;   1 = orthographic demote. Remix classifies it UI - but UI is RASTERISED AS A 2D OVERLAY, so
;       the shape stays visible with a changed transform.
;   2 = skip the draw. Removes it from Remix, but MEASURED TO BREAK THE ENGINE: the game's own
;       draw count collapsed from 2,615 to 593 per frame and the image froze, because the engine
;       reads that pass back - GPU occlusion culling is the likely consumer. The general rule it
;       taught: a draw whose RESULT the engine reads can never be skipped, only hidden.
;   3 = RETIRED. It bound our own 4x4 marker texture to stage 0 so the ONE hash it produced
;       could be tagged in rtx.ignoreTextures and Remix would drop exactly that pass. That
;       mechanism is gone on both ends: rtx.ignoreTextures no longer exists in rtx.conf
;       (removed 2026-08-31, once the 16 stale hashes it carried turned out to be painting
;       REAL GAME TEXTURES black rather than hiding anything of ours), and even where it did
;       exist Remix renders an ignored material as its own pink/black checkerboard, which is a
;       different kind of visible, not hidden. CreateMarkerTexture still runs at every device
;       creation - it is cheap and harmless - but nothing in the live configuration ever asks
;       for Disp::Mark, because hiddenPassMode stays at 2 below.
; DIAGNOSTIC 2026-08-29: set to 0 for ONE run. 0 = every hidden pass PASSES THROUGH instead of
; being skipped, so the shim removes NO draw from the engine at all while still converting.
;
; Why: the character atlas is now proven empty on the GPU, WITH a control - SelfTestCopyPath
; StretchRect'd a DEFAULT+DYNAMIC texture this shim filled itself and read back 126.7 of an
; expected 126.7, so the copy path works and the 0.0 for the atlas is real. But SR3's own
; material shader does `texld r2, v4, s0` on that texture, so if it were empty the game's OWN
; rendering would draw black characters too. Something fills it, and it is not being filled here.
;
; This run answers whether WE are the reason, and the answer is a NUMBER, not a judgement:
;
;     COMPOSITED ALBEDO ... last readback mean = M
;
;   M > 0 at hiddenPassMode=0 -> a draw the shim was SKIPPING fills the atlas. Bisect from here
;                                (screenSpaceMode=0 next) and the fix is a disposition, exactly
;                                as rule 1 says: a draw whose RESULT the engine reads can never
;                                be skipped.
;   M = 0 still               -> nothing we skip is responsible; the atlas is empty for the game
;                                too, and character colour is not coming from this texture.
;
; Expect this to be SLOWER, and the rasterised composite chain reaches the device again. It is a
; measurement, not a candidate fix. Put it back to 2 afterwards.
; MEASUREMENT 2026-08-29: 0 for this run, paired with rtx.useVertexCapture = True.
;
; The user reports the character WAS textured when vertex capture was on. The 08-29 test of
; capture=True was judged visually with no instrument - the atlas snoop did not exist yet - and it
; ran with hiddenPassMode=2 skipping ~2000 draws a frame. The historical state in which the atlas
; was demonstrably populated (captures 08-13..08-18, texture 8E4C8047F62D947A, mean 182.7, tattoos
; present) had capture ON and nothing being skipped. THAT COMBINATION HAS NEVER BEEN TESTED.
;
; This run tests it, and the answer is a NUMBER this time, not a judgement:
;
;     ATLAS SNOOP ... atlas N: 2048x1024 mean X of 255
;
; measured by memcpy straight out of the game's own mapped memory at UnlockRect, with no graphics
; API in between that could lie.
;
;   mean > 0  -> the game's compositor WORKS in this configuration. The lever is found, and the
;               job becomes making it viable: bisect capture vs hiddenPassMode, then convert the
;               world while letting characters reach Remix the way that works.
;   mean = 0  -> capture state does not affect the compositor, and the user's recollection is of
;               the pre-08-20 build rather than this one.
; BISECT step 2, 2026-08-29. Step 1 (capture=True + hiddenPassMode=0) produced
;
;     atlas 2: 2048x1024  mean 182.7 of 255      <- the real character texture, tattoos and all
;     atlas 3: 1024x512   mean 169.6 of 255      <- its normal map
;
; measured by memcpy out of the game's own mapped memory. 182.7 is exactly the mean of the
; historical good atlas 8E4C8047F62D947A. The compositor WORKS in that configuration.
;
; Two variables changed together, so this step restores the shim's skipping and leaves capture ON
; to find out which one is the lever:
;
;   mean stays ~182  -> vertex capture is the lever and the shim's skipping is irrelevant. This
;                       configuration is shippable as it stands.
;   mean falls to 0  -> the SHIM's skipping destroys the composite. Then a targeted rule has to
;                       spare exactly those draws - which is what compositeToTexturePass attempted
;                       blind, and can now be aimed with this mean as its falsifier.
hiddenPassMode=2

; What to do with screen-space quads (vertex shaders that never reference projTM).
;
;   0 = pass through. Remix reconstructs them and rasterises them over the path-traced world.
;   1 = orthographic demote. Remix treats them as UI - but UI is RASTERISED AS AN OVERLAY, so
;       this does not hide anything.
;   2 = mark the ones that sample a RENDER TARGET, so Remix's ignore list drops them.
;
; Measured 2026-08-18 from a complete frame dump: 49 screen-space draws, every one passed through,
; and together they are the entire deferred-resolve and post chain - the IR_GBuffer_Lighting and
; IR_GBuffer_Depth resolves, a 512x512 blur, the auto-exposure reduction (320x180 -> 64x64 ->
; 16x16 -> 4x4 -> 1x1), the colour LUT, and the two draws that write the back buffer. THAT is the
; "partial rasterised image over the path-traced world".
;
; Mode 2's separator is what the quad SAMPLES. It marks a quad when stage 0 is a render target we
; watched the game create, OR stage 0 is null (the IR_GBuffer_Depth resolves bind nothing), OR the
; shader names no colour sampler at all - that last case catches the depth resolve, whose source
; comes from CreateDepthStencilSurface and so never passes through our CreateTexture hook.
;
; A quad that DOES name a colour sampler is left alone: the HUD, a light cookie (Diffuse_Map_1
; into the 400x288 light buffers), or other authored 2D content. rtx.uiTextures is the mechanism
; for those. If a HUD element ever vanishes, it is one whose shader names no colour sampler -
; set this back to 1 or 0 and say so.
;
; The screen-space test runs BEFORE the light-volume test, and that ordering matters: 21 fullscreen
; quads a frame resolving IR_GBuffer_Depth/Lighting carry IR_Light_* constants, so the light-volume
; test used to claim them and refuse to mark them. They were the residual overlay.
; SETTLED, 2026-08-31 - LOAD-BEARING. This is the recorded fix for the black/untextured
; character skin, not a one-run experiment: do not delete this switch and do not "restore the
; default" of 2.
;
; SR3 bakes each character - skin, tattoos, clothing - into one 2048x1024 render target and
; samples that atlas as the character's albedo. The quad that fills it is screen-space (no
; projTM) with a rank-0 source, so it is classified the same way as any other post/composite
; quad - and that classification is exactly what this setting controls.
;
; IsAtlasComposite - the hook that re-issues a composite quad as fixed function so it survives
; capture-off - only ever fires when Classify has returned Disp::PassThrough for that draw.
; At screenSpaceMode=0, case 0 returns Disp::PassThrough for every screen-space quad directly,
; so the atlas-fill quad reaches IsAtlasComposite, is recognised, and DrawCompositeFixedFunction
; re-issues it - the atlas gets filled. At screenSpaceMode=2, the same quad instead falls into
; the "compositing the engine's own output" branch and comes back Hidden or Marked, never
; PassThrough, so IsAtlasComposite never sees it and the composite is silently dropped -
; characters render with a black atlas. docs/worklog.md records this exactly (the 2026-08-31
; entry: "screenSpaceMode=0 is the recorded fix for the black character skin").
;
; Step 1 (capture=True, hiddenPassMode=0):  atlas 2048x1024 captured, mean 182.7 - the real
;                                           character texture, tattoos and all.
; Step 2 (capture=True, hiddenPassMode=2):  the atlas was NEVER LOCKED. The game did not composite
;                                           it at all.
;
;   atlas mean ~182  -> screenSpaceMode=0, everything else stays skipped - this is that state.
;   atlas mean 0     -> a different skip rule kills it, and the frame dump names which.
screenSpaceMode=0

; ---------------------------------------------------------------------------------------------
; compositeToTexturePass - never SKIP a composite quad that draws into an OFF-SCREEN TEXTURE.
;
; THIS IS THE CAUSE OF "MY PLAYER SKIN IS BLACK AND HAS NO TATTOOS".
;
; SR3 bakes each character - skin, tattoos, clothing - into one 2048x1024 render target and then
; samples that atlas as the character's albedo. The 2026-08-28 frame dump shows the player's 36
; body/head draws (d4140-d4176, v=7977) ALL bound to one such atlas, tex0=3BA8F080, which
; ALBEDO BOUND reports as usage=0x200 - D3DUSAGE_RENDERTARGET.
;
; The quads that FILL that atlas are screen-space (no projTM) and their source is often a
; rank-0 sampler (Normal_Map_A and friends), so they land in the "post/composite quad" branch
; and hiddenPassMode=2 turns them into SKIP. Skipped, the atlas is never written, and every
; character is path-traced with a BLACK texture.
;
; The evidence is external - Remix's own captures, not inference:
;
;     captures 2026-08-13..08-18   atlas 8E4C8047F62D947A   mean 182.7   a real character face
;     capture  2026-08-23          atlas E881A25E37E37B19   mean   0.0   pure black
;
; and in the 08-23 capture, 72 character sub-meshes (bboxes 0.07-0.46 units - hands, head
; pieces) are bound to /RootNode/Looks/mat_E881A25E37E37B19, whose diffuse_texture IS that
; black file. The split lands exactly on the change to hiddenPassMode=2.
;
; This is rule 1 of this project for the FOURTH time: a draw whose RESULT the engine reads can
; never be SKIPPED, only hidden or passed through. The engine reads this one as a texture.
;
; The test is the TARGET, not the source: a quad drawing into a surface that is not the size of
; the screen is not compositing the screen. The back buffer and the 2560x1440 deferred-resolve
; chain keep exactly the disposition they have today - "skipping the composite quad freezes the
; image" is a recorded dead end and this must not reopen it.
;
; Measured on the 2026-08-28 frame dump BEFORE shipping: of 398 composite quads in that frame,
; 357 target 2560x1440 surfaces (untouched) and 41 target smaller surfaces (SKIP -> PASS).
; Pass-through submits the draw exactly as the game wrote it, and with
; rtx.useVertexCapture = False Remix refuses shader-driven draws outright, so nothing new
; reaches the path tracer - the same reasoning skipDeferredGBuffer already rests on.
;
; FALSIFIER, in the frame report:
;     composite into an off-screen texture ...: N draws/frame passed through instead - gate ON
;
; N near 41 is right. N = 0 means the rule did NOTHING and the black characters have another
; cause. N in the hundreds means it is catching the screen-sized resolve chain too, which would
; repaint the rasterised frame over the path-traced world - set this to 0 and say so.
; REVERTED 2026-08-28: fired exactly as measured (35.9 draws/frame, predicted ~41) but did NOT
; restore the character atlas, and the user reported NPC heads going darker. A change that is
; measured worse and fixes nothing goes back to 0 until the atlas evidence says which composites
; actually matter. The 35.9 are the post chain - the character atlas is composited at SPAWN and
; appears in no steady-state frame dump, so this rule never met the draws it was written for.
compositeToTexturePass=0

; Hide the inferred-lighting light volumes. Safe: EmitLight reads each light's parameters from
; the shadowed pixel-shader constants before the draw, so the light is injected whether or not
; the volume mesh is drawn. Follows hiddenPassMode.
hideLightVolumes=1

; ---------------------------------------------------------------- materials

; Convert SHORT2 texture coordinates to a float2 stream so RTX Remix can read them.
;
; THIS IS THE CAUSE OF "THE WORLD IS NOT TEXTURED", and it was never on our side of the bridge.
; From Remix's own log (rtx-remix/logs/remix-dxvk.log), with the VkFormat name table inside
; Remix's own binary used to decode the number:
;
;     warn: [rtx-interleaver] Unsupported texcoord buffer format (80), skipping texcoord
;
; VkFormat 80 is VK_FORMAT_R16G16_SSCALED - what DXVK maps D3DDECLTYPE_SHORT2 to. Every world
; vertex format in SR3 stores texture coordinates as SHORT2, so Remix DISCARDS them and the
; geometry is path traced with no UVs at all. Every surface then samples a single texel and
; renders as flat material colour: "maybe textures are loaded but the path tracer shows the
; material color".
;
; Re-declaring the same bytes as SHORT2N was tried first, because it costs nothing. Remix
; answered in the same words with a different number - format 78, VK_FORMAT_R16G16_SNORM. The
; interleaver wants real floats and no reinterpretation of those four bytes can produce them.
;
; So the coordinates are CONVERTED into a float2 buffer of our own, bound as a second vertex
; stream, with a clone of the game's declaration whose TEXCOORD0 points at it. Position, normal
; and every other element still come from the game's own buffers - the geometry is untouched and
; only the coordinates change.
;
; float2 is not a third guess. It is the only texcoord format known to work on this exact path,
; and it is known from the only two textured populations in the game today: characters, whose
; vertices this shim already rebuilds into a float2 FVF for skinning, and foliage, drawn from a
; game instance stream whose stream 0 is a single float2 TEXCOORD. Those two being the textured
; ones, and every SHORT2 surface being flat, is what identified the bug.
;
; Converted WHOLE BUFFER AT A TIME and cached on the source buffer, not per draw: ~450 draws a
; frame need this and most of them come out of a handful of large shared buffers. Converting per
; draw would rewrite the same city block's coordinates hundreds of times a frame. Whole-buffer
; conversion also makes the stream offset trivial - our entry i is source vertex i, so any draw
; binds it unchanged at any minIndex.
;
; The cache holds a reference on each source buffer, because its key is that buffer's address and
; a recycled address would otherwise hand a later mesh these coordinates. A reference cannot stop
; the game REFILLING a static buffer, so the vertex-buffer Lock hook drops the conversion whenever
; the game write-locks one.
;
; Values are stored RAW - the short widened to float, unscaled. The uv texture matrix already
; carries the 1/1024 and the per-material tiling, and that is the same convention the skinned path
; uses. Two owners for one scale is how the two come to disagree.
;
; Watch in the log: "SHORT2 texcoords converted to a float2 stream". Failures are counted
; separately for the conversion and the declaration clone. If the world is still flat and Remix
; still reports an unsupported texcoord format, read the number - it names what it rejected.
remixShortUV=1

; FIX 3 (2026-09-21): UvBufferFor's static (whole-buffer) and dynamic (snooped/ring) decodes both
; assumed stream 0 was bound at byte offset 0. A pooled source buffer bound at a non-zero offset -
; several accessories sharing one vertex buffer - fed every vertex ANOTHER vertex's texcoords: a
; bracelet or a glasses lens (or any accessory sharing a pooled VB) textured from the wrong part of
; the buffer, alongside the identical fix below for the hardware-skin side stream. Set to 0 to
; restore the old, offset-blind addressing with no rebuild.
uvHonourStreamOffset=1

; Extend the SHORT2 conversion above to DYNAMIC source buffers, via the vertex-buffer-lock
; snoop (the same mechanism the morph stream reads). Absent from this ini before now, so the
; built-in default (on) ruled silently even though the ini had nothing to point at.
;
; WHY IT MATTERS, measured 2026-08-31: DYNAMIC-source draws accounted for every one of
; 83,737 UV conversion failures in one run - about 6 draws a frame, all character parts the
; engine rewrites every frame. Refused, they keep raw un-normalised SHORT2 texcoords and the
; texture tiles into noise - visible with RAY TRACING OFF too, since the bad coordinates are
; in the rasterised draw itself. RegisterSnoop/SnoopCopy read the game's own writes, never the
; DYNAMIC buffer, and InvalidateUvBuffers drops the converted copy the moment the game refills
; it, so this is not a stale-data risk. 0 restores the old outright refusal for these draws.
convertDynamicUV=1

; Reset the stream frequency on converted draws that carry a single instance.
;
; Almost every converted world draw is a D3D9 INSTANCED draw - 377 of 378 in the run that exposed
; this - and every one carries exactly ONE instance, which the classifier already requires before
; it will convert at all. The instancing conveys nothing by then: the per-instance transform has
; already been read out of the stream and applied as the world matrix, and a single copy is drawn
; either way.
;
; What it does convey is instancing state that Remix has to cope with on a fixed-function draw.
; While rtx.useVertexCapture was on, the shader copies of the same geometry filled the scene and
; hid whatever Remix made of ours. With vertex capture off - which is what finally removed the
; magenta - our converted draws ARE the scene, and the report is that they "enter the view frustum
; and get deleted right after".
;
; Resetting the frequency makes them ordinary indexed draws, which is what they already are in
; every respect that matters here. The exact prior setting is restored after the draw, because the
; engine's own draws depend on it.
;
; MEASURED: the popping persisted with this on, so instancing is NOT the cause. Back to 0 rather
; than left in as a change that did nothing - a shim this size cannot afford settings kept because
; they are already there.
deinstanceConverted=0

; One pass over SR3's customisable-clothing materials, ahead of generating their textures.
;
; This family is why character clothing colour has never been right: it builds base colour PER
; TEXEL from a mask and three constants, and Remix never runs the game's pixel shaders. Read from
; ir_sr3npcclothfull_c.fxo_pc shader [8], not inferred:
;
;     texld r3, v0, s0                   ; Pattern_Map
;     sum  = p.r + p.g + p.b
;     dev  = |p.r-sum/3| + |p.g-sum/3| + |p.b-sum/3|
;     test = sum - (dev*165.016495 + 256)/255
;     test <  0 -> albedo = p.r^2.2*Diffuse_Color_a + p.g^2.2*Diffuse_Color_b + p.b^2.2*Diffuse_Color_c
;     test >= 0 -> albedo = saturate((p - 0.372549) * 1.59375) ^ 2.2
;     mul oC0, r1, c37                   ; whole result * Tint_color
;
; The channels are gamma-2.2 WEIGHTS, not plain masks, and a selector switches whole texels to a
; desaturated branch - which is how trim and skin escape the three customisation colours. The
; earlier tintFallbackAlbedo attempt failed because it modulated the whole pattern by the tint,
; multiplying a mask by a colour the shader never multiplies.
;
; 34 shader entries across 19 files carry the full set: the ir_*sr3pccloth* / ir_*sr3npccloth*
; family, player and NPC alike, including the alpha-test variants.
;
; The probe answers the two things that decide whether the generator can be built at all, neither
; of which is in the shaders:
;   1. Can the Pattern_Map be READ? These textures are D3DPOOL_DEFAULT and D3D9 does not promise
;      a lock on those. If it fails, the source has to be snooped from UpdateTexture at upload.
;   2. How many DISTINCT (pattern, a, b, c, tint) combinations occur? The generator caches one
;      texture per combination, which is only affordable if that number is small.
clothProbe=1

; ---------------------------------------------------------------------------------------------
; diffuseColorProbe - measure the albedo multiply this shim DROPS. Read-only, changes nothing.
;
; SR3's material pass does this, in ir_sr3npcskinfull_mc shader[8] (the character material pass):
;
;     texld_pp r2, v4, s0        ; Diffuse_Map                     <- the albedo
;     mul_pp   r2, r2, c0        ; * Diffuse_Color                 <- WE DROP THIS
;     ...
;     lrp_pp   r2.xyz, v3.w, c38, r0   ; fog
;     mul_pp   oC0, r2, c37            ; * Tint_color               <- AFTER fog
;
; SetupTextureStages binds the map with SELECTARG1/TEXTURE whenever one exists, so the
; `mul r2, r2, c0` never happens on a converted draw.
;
; Swept 2026-08-28 across all 846 disassembled files, because the last three regressions on this
; project all came from a rule generalised off one shader:
;   - Diffuse_Color scales a diffuse/blend/pattern sample in 215 pixel-shader entries, Base_Color
;     in 12, and Tint_color in 1 of the 1,944 entries that declare it;
;   - Tint_color is otherwise TERMINAL - 1,681 of 1,944 use it in the shader's last instruction,
;     1,927 within three of the end, and its only consumers are `mul` (2,025) and `rcp` (945).
;     Shaders divide BY it to undo it on a value read back from a buffer. That is what you do to
;     an exposure scale and never to a material colour. The other 147 uses are all `.w`, which is
;     car-glass opacity.
;
; So dropping Tint_color is CORRECT and needs no run to settle. Diffuse_Color is the only
; candidate left for the missing per-object albedo tint, and whether it matters is a runtime
; question this probe answers.
;
; FALSIFIER, in the frame report:
;     DIFFUSE_COLOR ...: N draws/frame carry it (S skinned)
;       NON-WHITE 0.00 draws/frame (0.00 skinned) | 1 distinct value seen
;         (1.000 1.000 1.000) x N draws   <- white, a no-op
;
; NON-WHITE 0.00 means the constant is white on every draw carrying it, applying it would change
; no pixel, and the character-tint question is CLOSED with no code change. A non-zero SKINNED
; figure is the missing per-object tint, and it also states how many draws a fix would affect -
; which is the number this project has twice shipped a rule without measuring.
;
; Set 0 to remove the probe entirely.
diffuseColorProbe=1

; ---------------------------------------------------------------------------------------------
; rtAlbedoCopy - THE LEADING CANDIDATE FOR OF "MY PLAYER SKIN IS BLACK AND HAS NO TATTOOS".
;
; SR3 composites every character - skin, tattoos, clothing - into ONE 2048x1024 texture created
; with D3DUSAGE_RENDERTARGET, and binds that as the character's diffuse map:
;
;     s0 Diffuse_MapSampler 3B3F5DD8 2048x1024 fmt=22 levels=9   <- bound as albedo
;     ALBEDO BOUND #5: ... 2048x1024 fmt=22 mips=9 pool=0 usage=0x200
;
; Remix hashes a texture from the content the game UPLOADS - the comment above the cloth
; generator says it outright: "UpdateTexture is also the upload Remix hashes". A render target
; is written by the GPU and never uploaded, so Remix has no pixels for it and builds the
; material from an ALL-ZERO image. Measured in the user's own Remix capture, 2026-08-28 19:13:
;
;     mat_E881A25E37E37B19   diffuse_texture 2048x1024   mean 0.0   100% near-black
;
; and 72 character sub-meshes are bound to it. The same hash appeared on 08-23 because an
; all-zero image always hashes the same.
;
; CORRECTED 2026-08-28: usage 0x200 is D3DUSAGE_DYNAMIC, not D3DUSAGE_RENDERTARGET (0x1). The
; first version of this rule tested for RENDERTARGET, matched NOTHING, and its own falsifier said
; so - "no render-target albedo has been seen", 0 copies, 0.0 draws/frame bound. The atlas is a
; DYNAMIC, CPU-written texture.
;
; D3DPOOL_DEFAULT + D3DUSAGE_DYNAMIC does not identify it either - EVERY albedo in this game is
; pool=0 usage=0x200 and the world is textured correctly. What identifies it is the FORMAT.
; Every streamed art texture is DXT1/DXT5; the character atlas is the only UNCOMPRESSED one,
; because it is composited at runtime instead of loaded from disk:
;
;     1024x1024 DXT1 | 1024x512 DXT5 | 512x512 DXT5 | 256x128 DXT1 | 128x256 DXT5   <- art
;     2048x1024 fmt=22 (X8R8G8B8) mips=9                                            <- the atlas
;
; So the test is: DEFAULT pool, UNCOMPRESSED X8R8G8B8/A8R8G8B8, DYNAMIC or RENDERTARGET, and at
; least 256x256.
;
; THE READ GOES THROUGH THE GPU. Measured 2026-08-29 with charTexDump, which decodes every
; character stage through the same LockRect(READONLY) the first version of this used:
;
;     Pattern_Map  32x32     DXT1     mean  85.0   content
;     Sphere_Map   128x128   DXT1     mean 202.7   content
;     Dob_Map      512x512   DXT1     mean 132.2   content
;     Diffuse_Map  2048x1024 fmt=22   mean   0.0   BLACK    <- the character atlas
;     Normal_Map   1024x512  fmt=21   mean   0.0   BLACK    <- its normal map
;
; Every DXT texture in those same draws read back correctly; both UNCOMPRESSED ones read as
; zeros. A character's normal map is not empty - the game shades characters with it - so that
; was a blind READ, not an empty texture. D3D9 leaves the contents of a D3DPOOL_DEFAULT +
; D3DUSAGE_DYNAMIC surface UNDEFINED under a READONLY lock: it is write-only from the CPU side.
;
; So the copy now asks the GPU: StretchRect into a render target we own, then
; GetRenderTargetData to resolve that - a path whose contents ARE defined. If the pixels exist
; on the GPU this sees them, and a zero mean now really does mean the atlas is empty.
; "StretchRect refusals" in the report is the new failure mode: D3D9 says the source of a
; StretchRect should be a render target or offscreen plain surface, and an ordinary texture
; level may be refused. Non-zero there means this route is closed and the copy has to be done by
; drawing a quad instead.
;
; One readback per distinct texture, at most one per FRAME (it is write-combined memory across
; the 32->64-bit bridge and slow), the source AddRef'd, a 64 MB ceiling with refusals counted,
; and every allocation in try/catch so a failure refuses a texture instead of killing the game.
;
; A blank readback is NOT cached: a character's atlas is composited when it SPAWNS, so the first
; sight of one can legitimately precede its content. rtAlbedoRetries bounds how many frames it
; keeps trying (240).
;
; FALSIFIER, in the frame report - it separates the causes this bug has had:
;
;     COMPOSITED ALBEDO ...: T textures matched, N copies made, B blank readbacks, F failed, ...
;       last readback mean = M of 255
;
;   T = 0    the rule never recognised the atlas AT ALL and did nothing. This is what the first
;            version scored, and "textures matched" exists because it had no such counter.
;   T > 20   it is claiming far more than the character atlases - check the ceiling and the MB.
;   M > 0    the pixels WERE there and only Remix lacked them - this fix is the right one.
;   M = 0    the game genuinely never wrote the atlas, so the composite draws really are being
;            lost and compositeToTexturePass was the right idea aimed at the wrong frames.
;
; Set 0 to revert to binding the render target directly (the black-character behaviour).
rtAlbedoCopy=1

; ---------------------------------------------------------------------------------------------
; atlasSnoop - THE FIX FOR "MY PLAYER SKIN IS BLACK AND HAS NO TATTOOS".
;
; Established by elimination, each step with a control:
;
;   * with d3d9.dll renamed away - no DXVK, no Remix, shim inert - THE CHARACTER IS TEXTURED
;     CORRECTLY. So the game, the save, the character mods and SR3's settings are all fine.
;   * it is not configuration: rtx.conf restored wholesale from 08-18, user.conf, allowDiscard,
;     apitraceMode - each verified parsed, each inert.
;   * it is not the shim: ffp=0 and hiddenPassMode=0 both leave it black.
;   * the texture measures all zeroes through a GPU read whose control returned 126.7 of an
;     expected 126.7, so the read is sound and the image really is empty.
;
; Four fill probes then named the route. SR3 writes the atlas by taking each mip level's SURFACE
; with GetSurfaceLevel and locking THAT - `IDirect3DSurface9::LockRect`, a DIFFERENT vtable from
; `IDirect3DTexture9::LockRect`, which is why the earlier probes saw nothing:
;
;     SURFACE LockRect 18 | texture LockRect 0, UpdateTexture 0, UpdateSurface 0,
;                           StretchRect 0, ColorFill 0
;     TEXTURE FILL #3: SURFACE LockRect flags=0x0 pitch=8192 whole   <- 2048 wide, mip 0
;     #4 pitch=4096  #5 2048  #6 1024  #7 512  #8 256                <- the rest of the chain
;
; Those writes land on native D3D9 and do not survive into the image Remix samples. So this takes
; the pixels at the CPU boundary, where they demonstrably exist, and re-uploads them through
; SYSTEMMEM + UpdateTexture - the path Remix hashes, as the cloth generator already relies on.
; Same architecture as the morph and instance stream snoop, applied to a texture.
;
; Mip 0 only: Remix samples the top level for a material, and 2048x1024x4 is 8 MB per character.
; A sub-rect lock is refused rather than partially captured - handing Remix a partial texture as
; though it were complete would be a worse bug than the one being fixed.
;
; FALSIFIER, in the frame report:
;
;     ATLAS SNOOP ...: N captured, M copies uploaded, F capture failures | B draws/frame bound
;       atlas 1: 2048x1024  mean X of 255   <- what the GAME wrote
;
;   mean > 0        the pixels exist at the CPU boundary - every read further down the stack was
;                   denying something that was there, and the copy should now show on screen.
;   mean = 0        the game writes zeroes and the fault is upstream of D3D9 entirely.
;   N = 0           no top-level surface lock on a tracked atlas was seen; the snoop did nothing.
;   B = 0 with N>0  captured but never bound - the albedo path is not reaching it.
;
; Set 0 to revert to binding the game's own (empty) texture.
; EMERGENCY OFF 2026-08-29: the render-target content probe added alongside this froze the game
; right after the intro logos. It allocated a CreateOffscreenPlainSurface per read - 14.7 MB for
; each 2560x1440 candidate - and did a full GPU sync every four frames, forever, in a 32-bit
; address space. That is the same failure this project already recorded once, when pre-sizing the
; snoop buffers "exhausted a 32-bit address space and killed the game".
; This gate gets the game running again with no rebuild; the probe is being fixed properly.
atlasSnoop=1

; ---------------------------------------------------------------------------------------------
; snoopValidateSource - keep the atlas snoop above from being able to crash the game.
;
; A minidump from a real world-load crash showed the snoop's unlock-time copy faulting a
; memmove reading a surface pointer captured back at lock time - the surface had gone
; unmapped in the gap between the two (a DISCARD rename, a lost device, another thread,
; the surface simply freed) and the old code walked straight into the hole. This is a
; DIAGNOSTIC that re-uploads the character atlas; it must never be able to take the process
; down. With this on, the whole source range is checked with VirtualQuery before the copy
; runs at all, and the copy itself is wrapped in a structured-exception guard for the race
; where a range validates clean but is unmapped a moment later. Both outcomes are counted
; and reported on the ATLAS SNOOP line. Set 0 to restore the old unconditional copy.
snoopValidateSource=1

; g_internal is the flag that stops our hooks reacting to our OWN D3D9 calls, and until
; 2026-09-17 it was a plain global. The RENDER thread holds it true across the whole of
; BeginFFP (cloth generation, uv buffer locks, atlas re-upload, the decal probe's texture
; dumps) while the game locks and unlocks its atlas surface and its vertex buffers on its
; MAIN thread. An unlock that landed inside our window was therefore SKIPPED, and its pending
; entry was left in the table holding a pointer that died the moment the real Unlock returned.
; The lock side never de-duplicated by surface either, so the next lock appended a SECOND
; entry and the next unlock found the OLD one first and copied from the dead pointer. That is
; the 2026-09-14 crash: memcpy source 0x59ADF000, length 0x2000, which is 2048x4, one row of
; the character atlas, faulting in CopyUpLargeMov inside the CRT memmove on the game's main
; thread.
;
; At 1 the flag also records WHICH thread set it, and every guard read asks whether this is
; that thread. At 0 it is a bare read of the flag again, which restores every race this was
; written to fix. Kept switchable because a thread-local cannot be turned off from an ini, and
; because an ownership model that is subtly wrong should be A/B-able without a rebuild.
snoopThreadScopedInternal=1

; The same defect one layer along. Hook_VBUnlock now consumes its pending entry regardless of
; the internal flag, which is what makes a main-thread unlock work while the render thread is
; busy, but the shim itself read-locks the game's stream 0 from about seventeen places and only
; two of them check for a DYNAMIC buffer first. Without an owner test our own unlock could
; consume the game's pending entry, copy a HALF-WRITTEN buffer into the snoop cache, flag every
; byte fresh, and leave the game's real unlock with nothing to consume. At 1 an entry is only
; consumed by the thread that recorded it.
vbUnlockOwnerThread=1

; Write sr3-rtx-test.dmp once at startup, with no exception, so the minidump writer can be
; opened in a debugger and checked on demand. It exists because the last dump recorded
; MINIDUMP_THREAD.Stack.Memory.Rva = 0 for all 35 threads, so no stack could be walked from it,
; and the flag that was believed to have fixed that (MiniDumpWithThreadInfo) cannot have been
; the cause: thread stacks come from the ThreadListStream, which every dump type writes. Until
; a dump is actually opened and checked, the fix is unverified. Leave at 0 for normal play.
crashTestDumpAtStart=0

; ---------------------------------------------------------------------------------------------
; rtContentProbe - DO NOT ENABLE. Reads the GAME's render targets with GetRenderTargetData.
;
; It froze SR3 twice: once unbounded (a 14.7 MB CreateOffscreenPlainSurface per read every four
; frames), and AGAIN at one read per 120 frames with a 60-read total budget and big surfaces
; capped at three attempts. The second freeze is the informative one - at that rate the cost
; cannot be the problem, so **Remix's D3D9 cannot service a readback of a surface it owns and is
; actively using.**
;
; That is itself a finding, and it is consistent with the whole investigation: if SR3's character
; compositor reads back its own render target the same way, it gets nothing under this stack and
; faithfully writes the zeroes it just read - which is exactly what the atlas snoop measured
; coming out of the game's own mapped memory.
;
; Left in the source, off, behind its own key so that atlasSnoop can be used without it.
rtContentProbe=0

; Frames to keep retrying a render-target albedo whose readback comes back blank, before giving
; up on it. Characters composite their atlas at spawn, so the first sight of one can precede its
; content legitimately.
; Raised for the hiddenPassMode=0 diagnostic: the atlas may be composited late, and at 240 the
; retry loop gives up after about ten seconds. 3000 keeps checking for roughly two minutes.
rtAlbedoRetries=3000

; Build clothing albedo per outfit from the pattern mask and the player's chosen colours.
;
; The probe answered both of its questions on 2026-08-20, and both answers made this cheap:
;   - the Pattern_Map read-lock SUCCEEDS on D3DPOOL_DEFAULT under DXVK (8 of 8, none failed), so
;     no UpdateTexture snooping is needed;
;   - every pattern measured 32x32 DXT1. 1024 texels. A whole outfit generates in microseconds
;     and costs 4 KB, so the one-per-frame amortisation and worker thread that were being
;     designed for are both unnecessary.
;
; The gamma is exact rather than approximated: every input to pow(x, 2.2) is an 8-bit channel, so
; a 256-entry table covers the whole domain and no pow runs in the loop.
;
; Tint_color is deliberately NOT applied. It measured as (5.0, 5.0, 5.0) on every draw - an
; exposure multiplier for the inferred-lighting pipeline, applied after lighting, not a material
; colour. Baking a factor of five into an 8-bit texture would clip every channel to white. This is
; the same mistake tintFallbackAlbedo made in a different form.
;
; SCOPE: the 20 shader entries where the pattern IS the albedo - the NPC clothing family. The 14
; PLAYER entries (ir_at_sr3pccloth_*) are a DIFFERENT recipe:
;
;     layer  = lerp(lerp(lerp(1, Diffuse_Color_c^2.2, p.b), Diffuse_Color_b^2.2, p.g),
;                                                           Diffuse_Color_a^2.2, p.r)
;     albedo = Diffuse_Map * Diffuse_Color * layer
;
; a layered mask over a full-resolution Diffuse_Map, with the pattern on a SECOND texture
; coordinate set (v1, with ClampU1/ClampV1). Folding those into one texture is only possible if
; TEXCOORD1 is a fixed transform of TEXCOORD0, which is a question about the vertex data rather
; than the shaders - so clothProbe now reports the texcoord sets for those draws.
;
; Each generated texture has a stable hash of its own per outfit, which is what makes it
; replaceable later.
generateCloth=1

; Write the first three generated outfits and their decoded source patterns out as raw RGB, into
; the game directory as cloth-pattern-N-WxH.raw and cloth-result-N-WxH.raw.
;
; Turned on 2026-08-20 for one question that argument could not settle: single-colour garments come
; out correct and multi-colour ones do not. That separates two candidates - the DXT decode
; producing wrong texels, or the channel-to-colour mapping being wrong - and both are visible
; immediately in the pixels while neither is visible in any counter.
;
; Raw rather than PNG on purpose: no encoder belongs in the shim, and the dimensions are already in
; the filename. Off by default; it writes files into the game directory.
clothDump=0

; Write every named texture stage of the first 8 skinned materials out as raw RGB, into the game
; directory as chartex-N-sM-<SamplerName>-WxH.raw.
;
; Turned on 2026-08-20 for hair and skin. The constants ruled themselves out - every character
; colour constant measured (1,1,1) and Tint_color (5,5,5) - so the colour is in a TEXTURE, and the
; sampler names do not say which. The hair material binds a 256x256 Diffuse_Map as albedo while a
; 512x512 Dob_Map sits beside it at s0, and both are plausible from the name alone.
;
; Dumping and looking is what settled the clothing question in one run after argument had failed
; twice, so it is the first move here rather than the last.
; ENABLED 2026-08-29 as the CONTROL for the composited-albedo readback.
;
; `COMPOSITED ALBEDO` reported "1 textures matched, 240 blank readbacks, last readback mean 0.0".
; That has two readings and the counter cannot tell them apart:
;   (a) the atlas genuinely holds nothing;
;   (b) a D3DPOOL_DEFAULT + D3DUSAGE_DYNAMIC texture locked READONLY has UNDEFINED contents in
;       D3D9 - it is write-only memory from the CPU side - so zeros mean "unreadable", not
;       "empty". The game samples that same texture and draws characters correctly, which argues
;       the content IS there.
;
; charTexDump decodes every named stage of the probed character materials through the SAME
; LockRect(READONLY) path and writes each to chartex-<tag>-<w>x<h>.raw. The DXT art textures are
; the control: if they come out as real images and the 2048x1024 atlas comes out black, the atlas
; has no CPU-readable content and the copy must go through the GPU instead. If everything is
; black, the read path itself is blind and nothing measured through it can be trusted.
charTexDump=0
; (the control ran on 2026-08-29 and answered: every DXT stage decoded with real content, both
; UNCOMPRESSED character maps decoded as pure black. Off again - each dump is up to 6 MB of .raw
; written into the game folder.)

; Key that re-arms the frame dump and the shape probe. Default 0x78 = F9; 0 disables.
;
; Both dumps used to fire ONCE, automatically, on the first frame with enough draws to count as
; being in the world - a second or two after loading, wherever the camera happened to point. Every
; character problem in this project has been diagnosed from whatever that arbitrary frame caught,
; and it has now twice failed to catch the thing being looked at: "the capture did not capture it
; and did not capture the npc with proper textures".
;
; Press the key while the problem is on screen and the NEXT frame is captured. Each press writes
; its own numbered pair, sr3-rtx-frame-N.log and sr3-rtx-shapes-N.log, so several can be taken in
; one session and compared; the first automatic capture keeps the original unnumbered names.
;
; Polled in Present, between frames, so a capture never begins with a frame already half recorded.
captureKey=0x78

; Refuse to read a bone palette for a draw whose VERTEX SHADER declares no BLENDINDICES input.
; 1 = the mesh keeps its bind pose and objTM places it (what the game's own shader does).
; 0 = the old behaviour: fall back to c52 and pose it from whatever is there.
;
; Found by disassembly 2026-08-26, not by testing. The car body and car glass ship in two
; variants over the SAME mesh and the SAME vertex declaration:
;
;     ir_sr3cardiffusespec_g_v   dcl_position v0 / dcl_normal v1 / dcl_blendindices v2
;                                mul r2.x, c0.z, v2.x ; mova a0.x, r2.x
;                                dp4 r0.x, c52[a0.x], r1        <- bone, THEN objTM
;
;     ir_sr3cardiffusespec_g_s   dcl_position v0 / dcl_normal v1        <- no blendindices
;                                dp4 r1.x, c32, r0              <- objTM alone
;
; The shim decided "skinned" from the vertex DECLARATION, which is shared between the two and
; still carries BLENDINDICES. For the static variant the shader declares no palette, boneReg came
; back -1, and the code fell back to c52 - so a detached bumper was posed by whatever palette the
; last CHARACTER draw left in the register file. Its physics body never moved, because nothing was
; wrong with the object: only our copy of its geometry was being bent onto somebody's skeleton.
;
; Verified safe across all 1,693 shader files before shipping: 623 declare neither blendindices
; nor Bone_weights (the static variants), 110 declare both without blendweight (single-bone
; vehicles), 111 declare all three (four-bone characters), and ZERO declare Bone_weights without
; blendindices - so this gate can never stop skinning a shader that genuinely skins.
;
; Falsifier in the frame report:
;     NO BONE DECL: N draws/frame whose vertex shader reads no BLENDINDICES
; If N is 0, no draw ever took the fallback and this fixed nothing. Set to 0 to bring the drift
; back on demand - that is the A/B, and it needs no rebuild.
skinRequireBoneDecl=1

; Size in MB of the ring the CPU-skinned vertices are written into (4-256, was fixed at 8).
;
; The write position is forced to firstVertex*stride so the game index buffer can be reused
; verbatim, which means the ring is consumed much faster than the vertex count suggests - each
; draw skips forward to its own index base. When it fills, the wrap issues D3DLOCK_DISCARD over
; the WHOLE buffer and orphans the allocation.
;
; That is the only shared mutable memory in the skinned path, and how often it recycles scales
; with how much skinned geometry is on screen - the one property of the reported drift that
; nothing else has explained. Establishing 2026-08-25 that the drift needs OUR asi (absent with
; the shim disabled and Remix reconstructing the same objects) is what made this worth testing.
;
; Falsifier in the frame report:
;     SKIN RING: N MB, high water H MB, W wraps/frame, D discards/frame
; If wraps/frame is 0 at this size, the ring is never recycled mid-frame and this is not the
; cause. High water says how large it would need to be for that to hold.
;
; 2026-08-26, run at 64: wraps went to 0.00/frame with a high water of 15.24 MB - so at the
; old 8 MB the ring WAS recycling mid-frame, and the hypothesis was live rather than idle.
; But 64 MB made the game unplayable in a busy street: a whole-buffer DISCARD renames the
; ENTIRE allocation once a frame regardless of how little of it we write, so its price is
; set by this number and not by the vertex count. 24 clears the measured 15.24 MB by 57%,
; which keeps wraps at 0 while asking the driver for a third of the memory per frame.
; SKIN RING LOCK in the same report now times that lock directly, so the next run says
; whether the size costs frames instead of leaving it to be inferred from a sawtooth.
skinRingMB=24

; Answer the engine's GPU occlusion queries "fully visible" (0 = leave them alone).
;
; SR3 does its own occlusion culling: it draws a bounding volume, wraps it in a
; D3DQUERYTYPE_OCCLUSION query, reads the visible-pixel count back, and stops submitting any
; object whose count came back zero. That readback is the rule recorded against hiddenPassMode=2 -
; "a draw whose RESULT the engine reads can never be skipped, only hidden".
;
; rtx.useVertexCapture = False is a global skip of every shader draw, the depth prepass included,
; so the depth buffer those queries test against is never written and every query answers zero.
; Measured 2026-08-23 from two frame dumps taken in the same area (camera y~147 both times):
;
;     capture ON   5330 draws/frame   (MARK 3930, CONVERT 1260, PASS 140)
;     capture OFF  1426 draws/frame   (MARK 1182, CONVERT  220, PASS  24)
;
; A 73% collapse in the GAME's own submission, against the 77% collapse recorded for
; hiddenPassMode=2 - the same failure. It is the whole "objects enter the frustum and are dropped"
; symptom: the game asks whether an object is visible, is told no, and stops drawing it. Objects
; clipped by a frustum plane survive because an occlusion test on a clipped bounding box is
; unreliable and engines skip the query for those, which is exactly why only the periphery
; rendered.
;
; The fix needs nothing from Remix. Queries are D3D9 objects and we are the D3D9 layer.
;
; ONLY D3DQUERYTYPE_OCCLUSION is touched - D3DQUERYTYPE_EVENT is a frame-pacing fence and lying
; about one of those would break synchronisation rather than culling. The real query is never
; drained: calling through can carry D3DGETDATA_FLUSH, which stalls on the GPU across the
; 32-to-64-bit bridge, the same mistake that made the instance-buffer read lock present as a
; frame-rate collapse.
;
; Expect MORE geometry submitted than the game would normally draw, and a frame-rate cost with it.
; That is the intended trade while functionality is the priority.
;
; The frame report carries its own falsifier:
;     occlusion queries: N read back/frame, M answered VISIBLE/frame
; "read back" is counted even with this off, so one run with it off measures the baseline. On with
; M = 0 means the hook never fired and nothing observed can be credited to it.
forceOcclusionVisible=1

; The command-block scan was engine research (docs/engine-map.md) and it walks every block the
; engine submits, on the draw path. Off now that the research is done: 0.5-1 ms a city frame.
scanCommandBlocks=0

; The uv and occluder caches are invalidated through a per-buffer index instead of a scan of the
; whole cache per invalidated buffer (~60 a frame x ~2300 entries was the 1.2 ms "drain").
indexedInvalidation=1

; PERFORMANCE (2026-09-10). Each forwarded draw is a 32->64-bit bridge round trip, ~7 us; a
; city frame carries ~2800 of them and 21 ms of a 40 ms frame is spent inside the draw path.
; Two kinds produce nothing and are not forwarded:
;   skipOcclusionProxies    the box the engine draws inside each occlusion query so the query
;                           can count its pixels - the count is fabricated anyway - and the
;                           query's Issue(BEGIN/END) calls. Gated on <= occlusionProxyMaxPrims
;                           so a real object drawn inside a query is left alone. The frame
;                           report's "NOT FORWARDED" line histograms what was seen.
;   skipDeclinedPassThrough pass-through draws with a vertex shader bound, which Remix DROPS
;                           with rtx.useVertexCapture = False. Set to 0 if vertex capture is
;                           ever turned back on, or the sky/post passes Remix would then
;                           reconstruct will be missing.
skipOcclusionProxies=1
occlusionProxyMaxPrims=12
skipDeclinedPassThrough=1

; THE STRETCHED POLYGON. Found 2026-09-18, and it is NOT a decal.
;
; The game submits searchlight beams and light shafts as four-vertex quads about 46 units wide
; and 785 units TALL, additively blended (SRCALPHA/ONE). Their entire shape lives in an
; Alpha_Mask sampler at register 3. The shim's single-stage path picks Diffuse_Map by name rank
; (100 against 0 for Alpha_Mask), disables stages 1 to 7, and so never binds the mask; with no
; Alpha_Threshold declared and a non-decal albedo, ALPHAARG1 falls to TFACTOR, which is forced
; to opaque white. Alpha pinned at 1.0 under additive blending contributes the FULL diffuse
; texture. Measured from the frame dump: at(470.8 107.3 1128.3) seen from cam(33.5 29.3 169.6)
; with proj _22 = 4.647, a 785-unit quad subtends 40.8 degrees against a 24.3 degree field of
; view, which is 168 per cent of screen height. A soft cone of light becomes a solid bright
; slab across the scene.
;
; The user reported that the stretched polygons appear whenever decals are distorted. That
; correlation is real and the observation was accurate: these beams are submitted INTERLEAVED
; with the decals in the same late alpha-blended pass (frame dump draws 6223 to 6238 run decal,
; decal, beam, beam, decal). Co-location in one pass, not causation. They are two faults.
;
; At 1 these draws go through the hidden-pass policy, which under hiddenPassMode=2 means SKIP,
; so the beams vanish rather than rendering as slabs. That is a removal, not a repair: doing it
; properly needs the mask bound on a second texture stage. Only four shaders in the whole
; corpus name an Alpha_Mask sampler (ir_vfxmask_s/_bs, ir_vfxmasktod_s/_bs), so this cannot
; over-match. Set to 0 for one run to see the slabs again and read aarg1=3 on those rows.
skipMaskOnlyVfx=1

; THE RASTERISED FRAME PAINTED OVER THE PATH-TRACED ONE. The user's standing requirement, 2026-09-21:
; "at some camera angles the rasterized render of the game replaces the scene... we must find a
; permanent solution for this no matter what."
;
; This has come back repeatedly, each time fixed by a rule on ONE path while it returned through
; another. With rtx.useVertexCapture = False, Remix refuses any draw that carries a vertex shader,
; so a draw the shim merely passes through is invisible. The rasterised frame can therefore only
; reach the screen riding on a draw the SHIM makes visible, and with rtx.orthographicIsUI = True a
; UI-demoted draw is rasterised as a 2D overlay ON TOP of the path-traced image.
;
; The confirmed gap: the user-pointer HUD test was only "no projection matrix and depth test
; off" and never asked what the quad SAMPLES, so a full-screen post effect reading the game's
; rendered frame (sun glare, lens flare, bloom: camera-angle dependent) was rebuilt as fixed
; function, kept the game's own pixel shader, and handed to Remix as UI. The indexed user-pointer
; path was worse: it classified nothing at all.
;
; So this is an INVARIANT, one predicate checked at every exit where a draw becomes visible:
; a SCREEN-SPACE draw (no projTM, the file's own definition) that SAMPLES a render target and
; WRITES a screen-sized target never reaches Remix. Each half has a job. Screen-space keeps world
; materials that legitimately sample reflection targets from vanishing. Samples-a-render-target
; lets the HUD through, since icons sample authored textures. Screen-sized-target lets the
; character atlas composite through, since it writes an off-screen 2048x1024 texture.
;
; Every firing is counted by exit path on the RASTERIZED-FRAME INVARIANT report line, and the
; first twelve are logged as BLOCKED (rasterized-frame invariant) #n, naming the path, the stage
; that held the render target and its size. That is how a run proves which draw was painting
; the frame. Set to 0 to restore the old per-path behaviour.
blockEngineOutputToScreen=1

; THE OVERLAY, EXPLAINED FROM REMIX'S OWN SOURCE (tag remix-1.5.2), 2026-09-21. The invariant above
; caught the right draws and the overlay happened anyway, because its premise was only half true.
; Before Remix composites its path-traced image a shader draw really is invisible. But
; internalPrepareDraw opens with: if (m_rtxInjectTriggered) return ... PreserveDrawCallAndItsState;
; so AFTER the injection triggers, every later draw in the frame is rasterized raw on top of it.
; The trigger fires on the first FIXED-FUNCTION orthographic draw (PROJECTION._44 == 1, depth write
; off) on a screen-sized target. Shader draws are discarded before that test, so ONLY THE SHIM'S
; OWN DRAWS CAN FIRE IT. At some camera angles one of ours fired before the game's final composite,
; and the composite then painted the raster frame over the path tracing. This also explains the
; old "skipping the composite freezes the image" dead end: that only happens after an early trigger.
;
; injectProbe measures which shim draw fires the trigger each frame and whether it came before the
; final composite (the bug) or after it (correct). Read the INJECT PROBE/CONTROL line first.
injectProbe=1

; injectControl is the fix, the technique the GTA IV RTX Remix mod uses on stock Remix: before the
; final composite, a pretransformed shim draw that would fire the trigger has PROJECTION._44 set off
; 1.0 for that draw alone (RHW vertices ignore transforms, so nothing visible changes), and once the
; composite has run, an invisible 0.01 pixel fixed-function quad is drawn on the back buffer to fire
; the trigger at exactly the right moment. Set to 0 to restore the old behaviour with no rebuild.
injectControl=1

; CPU skinning fast path (2026-09-10). The PROFILE line measured the skinning loop at 12.27 ms
; of a 27 ms city frame - 117,984 vertices over 24 draws. skinFast=1 runs a straight blend when
; rejectStaleBones, paletteSetupScope, vehicleBonesOff and clampBonesToUpload are all 0 (the
; output is then identical); skinThreads splits draws of 2048+ vertices over a persistent pool
; (0 = half the cores, capped at 4; 1 = single-threaded fast path).
skinFast=1
skinThreads=1

; HARDWARE SKINNING, the largest measured win available and currently OFF pending one run.
;
; CPU skinning is 88 per cent of the shim's frame cost (skin 10.46 ms of 11.89 ms measured).
; This route was abandoned long ago on MaxVertexBlendMatrixIndex = 8, but that is only what
; dxvk-remix REPORTS in its caps: its actual fixed-function skinning path stages maxBone + 1
; matrices from D3DTS_WORLDMATRIX(0), tracks the highest index the game sets with a default of
; 255, and both SetTransform and the 32-to-64 bridge validate up to WORLDMATRIX(255). A
; 58-bone palette fits. At 1 the game's own bind-pose buffer is left alone, normalised float
; weights and remapped indices go on a side stream, the used bones are staged as world
; matrices, and the GPU does the blend.
;
; It should also fix a class of flicker, not only cost: Remix computes its geometry hash BEFORE
; vertex capture replaces the input, so hardware skinning makes a character's hash its stable
; BIND POSE. Remix's own compatibility wiki says software animation will flicker while hardware
; animation should be stable.
;
; TO TEST: set this to 1 and launch. First read the startup line reporting MaxStreams: if it
; says the stream COLLIDES with the uv stream, the feature cannot run at all whatever this says.
; Then read the GPU SKIN report line. If it shows 0 draws hardware-skinned, the refusal
; breakdown beside it names the single test excluding them. Only then judge how the characters
; look. Set back to 0 to restore CPU skinning with no rebuild.
skinViaFixedFunction=1

; Four fixes to the hardware-skin path above, all found from one symptom: an accessory (a
; bracelet, a glasses lens) stretched toward another object's placement, more at other world
; locations - shipped together 2026-09-21, all default ON, each independently reversible.
;
; skinFFRestageBone0 - WORLDMATRIX(0) IS D3DTS_WORLD. Staging a mesh's bone 0 overwrites it, and
; the run of later draws sharing that same staged palette (8.9 draws/frame share one mesh key)
; restages NOTHING, so WORLDMATRIX(0) stays at the PREVIOUS draw's restored objTM instead of THIS
; mesh's Bone[0]*objTM for every vertex weighted to bone 0. Restages bone 0 alone on that reuse
; path. 0 restores the old restage-nothing-on-reuse behaviour.
skinFFRestageBone0=1
;
; skinFFHonourStreamOffset - the weight/index side buffer decodes stream 0 from byte 0 and binds
; at offset 0 always, regardless of what the game actually bound stream 0 at. A pooled source
; buffer at a non-zero offset then fed every vertex ANOTHER vertex's weights/indices, addressing
; bone slots THIS draw never staged - which held OTHER characters' bone matrices. This is the fix
; that matches the reported symptom exactly. 0 restores the old, offset-blind addressing.
skinFFHonourStreamOffset=1
;
; skinFFRigidDecl - the declaration clone only retargets an EXISTING BLENDWEIGHT element, but a
; rigid single-bone mesh (skinRigidSingleBone) legitimately declares BLENDINDICES and no
; BLENDWEIGHT at all, so every one of those declarations failed to clone and fell back to CPU
; skinning ("declarations: 3 made, 7 failed" is this population). Appends the missing element
; instead of requiring one to already exist. 0 restores the old retarget-only cloning.
skinFFRigidDecl=1
;
; skinFFFollowShaderInfluences - the fixes above still stage the GPU path from mesh->usedBones,
; built from the DECLARATION's weight/index bytes - never from what the VERTEX SHADER actually
; reads. A shader reading no BLENDINDICES places the mesh by objTM alone; one reading BLENDINDICES
; but no BLENDWEIGHT (every vehicle body/glass variant) uses exactly bone idx[0] at weight 1,
; whatever the declaration's other three weight bytes hold. Staging from the declaration instead
; means palette slots the vehicle never uploaded - still holding the PREVIOUS character's bones -
; get read anyway, so car windows and other rigid parts float with player/NPC animation. On:
; refuses a no-BLENDINDICES shader outright (CPU path handles it), stages exactly idx[0] for a
; no-BLENDWEIGHT shader, and refuses a four-bone draw with any vertex the shader would otherwise
; leave at its bind pose. 0 restores the old declaration-driven staging.
skinFFFollowShaderInfluences=1

; THE SHAPE BAKE. morphProbe measures whether a character's morph delta (the per-character
; customisation offset applied on top of the base mesh) actually CHANGES frame to frame, and how
; often - read its report (MORPH PROBE / MORPH BLOCK) before trusting morphBake. Shipped ON here
; so the next run answers that question; it changes no rendering by itself.
;
; morphBake - apply a character's morph delta ONCE into a whole-buffer copy of its source mesh,
; instead of refusing every morph-active draw from the GPU (fixed-function) skin path outright.
; Only safe when morphProbe's own report says the delta is static or changes rarely. 0 (shipped
; here) refuses morph-active draws exactly as before; CPU skinning (SkinAndBind) handles them,
; unchanged.
morphBake=1
;
; morphBakeMaxMB - total megabytes every baked copy may hold at once, LRU-evicted by last-used
; frame when a new bake would exceed it.
morphBakeMaxMB=64
;
; morphBakeMaxPerFrame - new bakes AND rebuilds (the delta actually changed since it was baked)
; are each capped at this many per frame. A rebuild count exceeding it is the delta-churn guard:
; the log says so once per frame rather than silently paying for a full re-bake every frame.
morphBakeMaxPerFrame=2
;
; morphProbe - see above. The next run measures before the bake is trusted.
morphProbe=0

; The bridge diet (2026-09-10). Averaged over 60 city hitches: 24 ms inside our hooks, 43 ms
; outside - the game's own D3D9 calls crossing the 32->64-bit bridge for draws that are then
; skipped. With rtx.useVertexCapture = False no vertex shader ever runs on the bridge, so:
;   dietVsConstants  SetVertexShaderConstantF is shadowed and NOT forwarded (bone palettes are
;                    3 KB per skinned draw). The frame report's BRIDGE CALLS line counts it.
;   dietVsBinds      SetVertexShader is shadowed; the bridge's binding is synced only before a
;                    draw that is actually forwarded.
; Both must be 0 if vertex capture is ever turned back on.
dietVsConstants=1
dietVsBinds=1

; CPU occlusion culling (2026-09-10). forceOcclusionVisible answers every query "visible", so
; the engine draws everything in the frustum. This does the test the engine cannot: the proxy
; inside each query is the object's box (read from the proxy shader's own constants), the rigid
; opaque converted draws are the occluders (geometry cached once per mesh), and a worker thread
; rasterises the largest into a small depth buffer and tests each box. In doubt the answer is
; VISIBLE. occlusionDryRun=1 computes and reports without changing any answer; set it to 0 to
; let the engine stop drawing what is entirely behind opaque geometry.
; REQUIRES forceOcclusionVisible=1: the culler refines that fabricated answer (visible -> 0 for a
; box behind opaque geometry) and is inert without it. The proxy skip and the Issue skip are
; compatible - the box is recorded before the proxy draw is dropped.
occlusionCull=1
occlusionDryRun=0
; The city offers 1,300-1,900 occluders a job. A cap of 300 put the boundary at rank 300, and
; every occluder that crossed it uncovered pixels: verdict flips on whatever sat behind. The
; cap is now above what the city offers and the triangle budget is the real limit; watch
; "ms on the worker" and "dropped (worker busy)" in the OCCLUSION CULL line.
occlusionMaxOccluders=2000
occlusionMaxTris=250000
occlusionMeshBudget=16
occlusionWidth=320
; Nothing whose nearest corner is within this many game units of the camera is ever culled by
; the shim - the engine's own behaviour stands in the near field.
occlusionMinDistance=5
; Hysteresis keyed by the OBJECT (box translation + size) rather than by the query pointer, which
; the engine can hand to a different object next frame. The OCCLUSION FLICKER line's
; "query->object remaps" says whether that ever happens.
occlusionKeyByObject=1
; An occluder within this many centimetres of a box's translation is the box's own object and
; never occludes it (0 = the exact quantised match only). Guards the self-occlusion flicker
; against float noise between the proxy's World_xform and the geometry's ObjTM.
occlusionSelfToleranceCm=50
; How many verdict flips (an object culled last job, visible this one, camera still) are
; explained in the log per report window. The OCCLUSION FLICKER line has the totals.
occlusionExplainFlips=40
; A game lock drops only the cached occluder meshes whose byte range it overlaps (a DISCARD or
; size-0 lock drops the whole buffer's). Meshes in a buffer the game appends to every frame
; otherwise blink out of the pool - 7 offered occluders a frame had "no mesh yet" in steady state.
occlusionRangeInvalidation=1
; An occluder used last job stays in the pool past occlusionMaxOccluders.
occlusionStickyOccluders=1

; Scan each skinned draw's index range once and count indices outside its declared vertex
; window. The skin ring holds only the window, so such an index reads another mesh's vertex: a
; triangle stretched across the screen for as long as that ring content lasts. The frame
; report's INDEX WINDOW line has the count; INDEX OUTSIDE THE VERTEX WINDOW lines name the first.
probeIndexWindow=1

; The SHADOW vs DEVICE read-back. Its report cap counted only MISMATCHES, so if the shadow ever
; AGREED with the device the guard would never arm and it would issue two
; GetVertexShaderConstantF calls, which are reads and therefore synchronous bridge round trips,
; on every single-bone skinned draw forever. The cap now counts runs, and the probe is off
; because it has already produced its answer: 12 draws checked, 0 matched, 12 mismatched.
shadowCheckProbe=0

; ProbeHudDraw had no switch at all and does two uncached GetDesc calls per draw while armed,
; for every draw in the frame until it has produced 8 reports, and EVERY F9 re-arms it. That is
; two bridge round trips times a thousand draws at exactly the moment a diagnostic capture is
; taken. Turn it on deliberately when the HUD is the subject.
hudProbe=0

; THE DECAL FIX UNDER TEST, 2026-09-17.
;
; Saints Row submits each building decal as a two to four triangle draw that declares the
; WHOLE MESH as its vertex window: NumVertices=28336 for primitiveCount=2. The shim forwarded
; that window to the device unchanged, and Remix's geometry GENERATION hash rule, read from
; Remix's own startup log rather than guessed, is positions, indices, texcoords,
; geometrydescriptor, vertexlayout, vertexshader. Positions and texcoords are in it, and
; rtx.geometryGenerationHashRuleString is not set in rtx.conf at all, so that default rules.
; (The rule this project stripped positions out of is the ASSET rule, which is a different
; thing and is still set the way it was.) So a decal's identity to Remix was computed over a
; 28,336-vertex slice of a buffer the streamer writes into every frame, while the decal's own
; six vertices never moved. That is the user's report that the decals have unstable hashes,
; and it explains why the shim's own 60-frame record shows nothing blinking: the draw is
; CONVERT in all 60 frames. What churns is Remix's geometry identity, not our disposition.
;
; TEAM A's cleanroom spec-geometry-format.md 8.1-8.2 confirms the engine itself stores tight
; per-range vertex bounds at +0x0C and +0x10, validated on 8,899 of 8,899 ranges, and that
; FUN_00e72d00 returns those two fields as the range's minimum and maximum vertex index. The
; tight window is authoritative engine data that the D3D9 call throws away.
;
; At 1 a converted rigid draw is issued with the range its indices actually reference.
; MinVertexIndex is the minimum index VALUE, NOT including BaseVertexIndex, so BaseVertexIndex
; and StartIndex are passed through unchanged and only the window moves. A computed range that
; is not entirely inside the declared one is refused and the original window is used, so this
; can never widen a window. Dynamic index buffers are refused outright because index buffer
; locks are not hooked, so a cache of their contents could not be invalidated.
;
; At 0 everything is still computed and reported and the draw goes out exactly as before, so
; the TIGHTEN WINDOW report line measures the size of the prize either way. If the world
; renders wrong with this on, set it to 0: no rebuild is needed.
tightenConvertedWindow=1

; The tight-range cache is keyed on a raw index buffer POINTER, and this game streams geometry,
; so a released buffer's address is handed straight back to the next one. That is the same
; defect already found and fixed with a held reference in three other pointer-keyed caches in
; this shim (shaders, declarations, uv buffers). The subset safety net cannot catch it: for the
; population this feature targets the declared window is the whole mesh, so almost any stale
; range is a subset and passes. At 1 each distinct index buffer is pinned at first sight and
; its size and format are folded into the key; at 0 the old unreferenced cache is restored.
tightenWindowPinIndexBuffers=1

; CORRECT the declared vertex window in BOTH directions, not only downward.
;
; The safety net written to stop US corrupting geometry turned out to be measuring the GAME
; doing it: 1.2 to 2.3 rigid draws a frame reference vertices OUTSIDE the vertex window the
; game declared for them, while the same probe over skinned draws reports 0.0. In D3D9 that is
; undefined. A vertex outside [MinVertexIndex, MinVertexIndex + NumVertices) is one the driver
; has no obligation to have available, and Remix builds its geometry from the range it is
; handed, so a triangle referencing such a vertex gets a garbage position. That is a polygon
; stretched across the scene, at one or two draws a frame, which is the reported frequency, and
; it would hit decals hardest because a decal is a tiny index slice inside a huge shared buffer,
; exactly where a lazy declared window is most likely to be wrong. The user has confirmed by
; recording that the stretched polygons appear when decals are being distorted.
;
; TEAM A's spec-geometry-format.md 8.1-8.2 says the engine itself stores exact per-range vertex
; bounds, validated on 8,899 of 8,899 ranges, which the D3D9 call then throws away.
;
; At 1 the window handed to the device is widened to cover what the indices actually reference,
; clamped to the real size of the bound vertex buffer. If the corrected window would run past
; the end of the buffer the draw is refused and counted separately, because that means the game
; is referencing vertices that do not exist, which is a different and worse problem. At 0 those
; draws are refused and fall back exactly as before. Either way the OUTSIDE WINDOW probe and the
; per-frame counts are measured and printed, so the population is visible with the gate shut.
widenUnderDeclaredWindow=1

; Evict the tight-range cache by age, the way the occluder mesh cache already does, instead of
; dropping an arbitrary entry. With arbitrary eviction a decal-dense area holding more live
; ranges than the cap thrashes and spends the whole per-frame index-buffer lock budget every
; frame forever, instead of once.
tightWinEvictByAge=1
; ORPHAN SWEEP: every pointer-keyed cache above holds a reference on a game-owned resource so a
; recycled address can never be handed an old buffer's cached data - correct, but for STATIC
; resources (a district streamed out, the whole city at the menu) nothing used to ever release
; that reference, and NvRemixBridge.exe kept them alive forever: 11,960 resources / 148
; declarations / 1,902 VS / 886 PS still alive on the server at exit, in one measured session.
; At 1 the shim periodically probes every reference it holds - a local AddRef/Release, no IPC -
; and releases whatever it turns out to be the ONLY holder of; anything still bound, or still
; held by the game, is left alone. At 0 the shim behaves exactly as it did before this existed.
orphanSweep=1
; How often the sweep runs, in frames. See the ORPHAN SWEEP report line for its measured cost.
orphanSweepFrames=120
; Tally and log what WOULD be released without releasing anything - the A/B for "is this finding
; the right population" before it is trusted to touch a live cache.
orphanSweepReportOnly=0
; Shaders and vertex declarations stay pinned (as before the sweep) unless this is 1. They
; are bounded by the game's own shader set and do not grow as you drive; releasing them
; allows address reuse against memos not yet audited.
orphanSweepShadersDecls=0

; The one-frame stretched polygons appear "when meshes load". A converted draw whose STATIC
; stream-0 range was written within the last deferFreshFrames frames is skipped for those
; frames (dynamic buffers and skinned draws are exempt). One frame of pop-in on a streamed mesh
; is invisible; if the flashes stop, the class is settled (bridge ordering or Remix's cache).
; The FRESH BUFFERS report line counts how many draws a frame this touches.
deferFreshStaticDraws=0
deferFreshFrames=1
; The rolling draw record: the last N frames' indexed draws, written to sr3-rtx-ring-N.log when
; F9 is pressed - press it the moment a flash is seen; the frames before the key are in it.
ringFrames=60

; ASSET HASH PROBE: on the frames after F9 is pressed, replicate Remix's own geometry-hash
; inputs (indices, geometry descriptor, texcoords) for every converted draw whose albedo
; names a Decal map or that is skinned, and report whether/what changes draw to draw - the
; ASSET HASH PROBE summary. Read-only: it binds and draws nothing differently. 0 disables.
assetHashProbe=0
; How many frames each F9-armed burst covers.
assetHashProbeFrames=60

; Frame stepping. F7 freezes the game with the current frame on screen; F8 releases exactly one
; frame (hold the camera key while stepping to turn one tick per press); F9 while frozen writes
; the rolling record. Every stepped frame gets its own sr3-rtx-frame-N.log when
; frameStepDumpEachStep=1 (about 300 KB each). Virtual-key codes in decimal; 0 disables.
frameStepPauseKey=118
frameStepKey=119
frameStepDumpEachStep=1

; Decal offset. A converted draw that does not write depth, or tests ZFUNC=EQUAL, is a layer on
; other geometry (posters, signs, dirt, road paint). Two coplanar surfaces shimmer in a path
; tracer; such a draw is pulled toward the camera by this many parts per thousand of its distance
; (1 = 1 mm per metre). The DECAL OFFSET report line counts them. 0 disables.
;
; SETTLED at 0, 2026-09-14. The coplanar theory this offset existed to fix is disproven: an
; exaggerated test (30 permille, 3% of the draw's own distance) made the decal VISIBLY
; SEPARATE from the wall - proving the world matrix and the pull both reach Remix - and it
; STILL flickered while separated. Z-fighting cannot survive a visible gap, so this is not a
; coplanar tie and pulling geometry toward the camera is not the fix. decalPrimaryOffset,
; biasOffset, blendedOffset and decalByLowestSampler below are left ON only so their OVERLAY
; OFFSET counters keep reporting - with this at 0 none of them moves a vertex, since all four
; are read only inside `if (decalOffsetPermille > 0)`. Do not turn them back on for this.
decalOffsetPermille=0
; Layer offset. The same triangles (vertex window and index range) at the same placement converted
; again in one frame with another texture are a second material pass over the same surface -
; coplanar; the exact-duplicate filter keeps both. Pulled toward the eye by pass number x this.
layerOffset=1
layerOffsetPermille=0
; A draw the game gives a depth bias is a decal by the game's own word: pulled too.
; INERT while decalOffsetPermille=0 above - read only inside that gate.
biasOffset=1
; The signs and building logos ARE decals and the game says so: their pixel shader's first
; sampler is a Decal map. They write depth and carry no bias, so no other rule saw them.
; INERT while decalOffsetPermille=0 above - read only inside that gate.
decalPrimaryOffset=1
; Which sampler decalPrimaryOffset above tests. 1 = lowestSampler, the sampler bound to the
; LOWEST register - what the shader actually samples first when it runs. 0 = the old test,
; firstSampler, which is only whichever sampler name sorts ALPHABETICALLY first in D3DX's CTAB -
; a different sampler entirely. Measured: 400 pixel shaders report a Decal map alphabetically
; first, but only 126 of them actually have one at the lowest register; the other 274 are
; ordinary wall/building materials. Kept togglable so the two can be compared without a rebuild.
; INERT while decalOffsetPermille=0 above: decalNamed is computed either way, but it is only
; READ inside `if (decalOffsetPermille > 0)`.
decalByLowestSampler=1
; A draw that really blends - by the FACTORS, not the flag; SR3 leaves ALPHABLENDENABLE on with
; ONE/ZERO for opaque draws - is a layer over what is behind it.
; INERT while decalOffsetPermille=0 above - read only inside that gate.
blendedOffset=1

; Drop bone influences whose matrix belongs to a DIFFERENT object (0 = blend them anyway).
;
; The c52 bone palette is shadowed shader constants, and that shadow persists across draws. A
; bone this object never wrote still holds the PREVIOUS object's matrix, so a mesh that reads one
; is posed partly by its own skeleton and partly by whatever was drawn before it.
;
; Measured 2026-08-25, per-bone provenance over a frame with NPCs and a knocked-off bumper:
;
;     111.4 clean/frame, 5.0 MIXED palettes/frame, 0.0 reading a bone nothing wrote this frame
;     worst spread 276 draws
;
; One object's palette arrives as a burst of consecutive calls sharing a draw index or within a
; draw or two of it. 276 draws apart is two objects. 5 of 116 skinned draws is 4.3% - the size of
; "a few car windows and a detached bumper", which is exactly what was reported moving around in
; sync with player and NPC animation.
;
; An earlier counter (BONE PALETTE ... BEYOND the upload's reach) measured this WRONG: it recorded
; only the last SetVertexShaderConstantF call, so a palette written across several calls looked
; one bone deep - "smallest upload seen 1 bones". Do not act on that line; the per-bone
; BONE PROVENANCE line supersedes it.
;
; Surviving weights are renormalised (the blend divides by the weight sum), so dropping an
; influence redistributes it across this object's own bones rather than shrinking the vertex
; toward the origin. A vertex that loses every influence stays in its bind pose, attached to its
; own object instead of teleporting onto someone else.
;
; Falsifiers in the frame report:
;     stale-bone rejection ON: N influences dropped/frame, N vertices left in bind pose/frame
; ON with 0 dropped means the filter never fired. A large bind-pose count means it is too
; aggressive and is flattening meshes rather than repairing them.
rejectStaleBones=0

; Ignore bone influences that lie outside this object's own palette upload (0 = use them anyway).
;
; Every palette upload in SR3 starts at c52 and runs as far as that object's skeleton needs -
; verified from the upload history, where lengths of 4, 5, 9, 20, 48, 51 and 58 bones all began
; at c52. The shadow therefore always holds a PREFIX belonging to the object being drawn and a
; TAIL left over from previous ones. A vertex bound to a bone in that tail is posed by another
; object entirely, usually a character, and follows its animation.
;
; A car draw is the whole car, with each vertex bound to its own part's bone - 17 to 18 bones on
; the meshes measured. So only SOME vertices are affected, which is why the result is a car that
; both drifts and STRETCHES: the bound vertices are dragged away and the rest stay put.
;
; The test is the upload's STAMP, not its length. Consecutive constant writes with no draw
; between them share a draw index, so a multi-call upload carries one stamp and is handled by
; construction. An earlier attempt compared against the last call's length instead and reported
; 'smallest upload seen 1 bones' - the measurement being wrong rather than the game.
;
; A rejected influence contributes nothing, so the vertex falls through to its bind pose and
; objTM places it - attached to its own car rather than teleported onto a person.
;
; Falsifiers in the frame report:
;     BONE CLAMP ON: N verts/frame bound to a bone OUTSIDE this object's own palette upload
; ON with 0 means it never fired. A percentage near 100 means it is rejecting nearly everything
; and flattening meshes - revert with clampBonesToUpload=0, no rebuild needed.
clampBonesToUpload=0

; Pose only by a bone palette published in this draw's OWN setup (0 = use whatever is resident).
;
; The c52 palette is shadowed shader constants and persists across draw setups. A draw whose own
; setup uploaded no palette silently inherits the previous object's bones - and which object that
; is depends on draw order, which depends on what is on screen.
;
; Measured 2026-08-25, and this is the drift itself rather than an inference about it: a mesh
; whose objTM was IDENTICAL between two frames moved 0.750 units, because bone[0]'s translation
; went from (0.132, -0.939, -0.360) to (0.000, 0.000, 0.000). Real position static, rendered
; position moving - exactly as reported.
;
; This is the same failure the code already guards against for objTM: a shader that declares
; objTM without uploading inherits whatever was left in c32, very often the player character's
; matrix. The remedy is the same one applied to the palette: a setup that published no palette
; gets IDENTITY bones, so objTM alone places the object.
;
; Setup boundaries come from the existing mechanism - a projTM upload following a draw - so this
; reuses the object-boundary definition that already works for objTM rather than inventing one.
;
; Falsifier in the frame report:
;     PALETTE SCOPE ON: N vertex influences/frame refused because the palette belonged to
;                       another draw setup
; ON with 0 refused means it never fired. A very large number means setups routinely rely on an
; earlier palette and this is too strict - revert with paletteSetupScope=0, no rebuild.
paletteSetupScope=0

; DIAGNOSTIC: ignore the bone palette entirely on single-bone (vehicle) draws and let objTM
; place the bind pose. Loses door swing, damage deformation and wheel spin. If cars are stable
; and correctly placed with this on, the palette is the whole problem and nothing else is.
vehicleBonesOff=0


; Scale applied to the generated clothing albedo, as a percentage.
;
; The generator was verified byte-exact against the shader on 2026-08-20: 21 distinct texel classes
; from a dumped 512x512 pattern, zero mismatches, decode and channel mapping and sRGB round trip all
; correct. So the recipe is not in question. What IS in question is the one term deliberately left
; out of it.
;
; The game computes  final = albedo * lighting * Tint_color,  with Tint_color measured at
; (5.0, 5.0, 5.0) on every clothing draw. That is an exposure factor for the inferred-lighting
; pipeline, and it cannot go into an 8-bit albedo texture without clipping. Leaving it out is
; defensible as physics - albedo should be 0..1 reflectance - but it makes these materials roughly
; five times darker IN LINEAR TERMS than the game shows them, which shifts apparent colour and not
; just brightness.
;
; Whether Remix's lighting wants the physical reflectance or something closer to the game's scaled
; value is a question about matching two lighting models, and looking at it settles it faster than
; arguing about it. 100 is unchanged behaviour; 500 applies the game's factor in full. Values above
; 100 clip the bright end, which is exactly why this is a knob to test with rather than a default.
clothAlbedoPercent=200


; Choose base colour by sampler name from the shader's constant table. Measured across every
; pixel shader in the game: stage 0 holds a Diffuse map 804 times but a NORMAL map 903 times, and
; Remix reads stage 0 as albedo - so those ~900 materials were being shaded with a tangent-space
; normal map. Ranking: Diffuse > Decal > Pattern > Blend > Grime > base > Illumination.
rankAlbedo=1

; Never treat a render-target texture as base colour. The light buffer, HDR scene buffer and
; shadow maps are generated data; binding one as albedo is what made surfaces flicker through
; unrelated images. Falls back to the largest authored texture bound anywhere - largest, not
; first, because a tiny detail map gives Remix a featureless surface it renders as a near-mirror.
excludeRTAlbedo=1

; Instrumentation only - it only logs and counts, never changes what renders. Detects a converted
; draw whose EffectiveAlbedo() pick differs from what the SAME draw (by vertex window, index
; range and world placement, never by texture) picked last frame, which is exactly the shape of
; bug excludeRTAlbedo's comment above describes: a stage holding a leftover texture from a
; previous draw, rebound as this draw's colour because draw submission order changed with the
; camera. Logs the first 10 offenders (shader sampler names, rank, stage, both texture pointers)
; and reports a per-frame rate plus both the per-draw dump (tex0=... alb=...) and the F9 rolling
; record.
albedoChurnProbe=1

; Pin each mesh to the first texture it was drawn with, to survive SR3 evicting a wall's unique
; texture under memory pressure and rebinding a shared fallback. Keyed on vertex buffer + base
; vertex + pixel shader; without the shader in the key, one mesh drawn with several materials
; collapses onto whichever texture was seen first.
;
; THIS IS THE PRIME SUSPECT FOR THE CRASH ON FAST MOVEMENT. Until 2026-08-18 it held raw texture
; pointers with no AddRef, across exactly the streaming eviction it exists to survive - a
; use-after-free. It now holds a reference and is capped at 4,096 entries.
;
; The fix has a cost of its own that is not yet measured: a reference held is a texture the
; streamer cannot evict, so a long drive pins up to 4,096 of them. The log says "mesh albedo cache
; full" when the cap is reached. If that turns into VRAM pressure or stutter, the question to ask
; is not how to tune the cap but whether this cache should exist at all - excludeRTAlbedo already
; covers one of the two symptoms it was written for, and address recycling in the very bug above
; could account for the other. Set this to 0 to find out; it needs no build.
;
; OFF, 2026-08-19, to answer exactly that question. Four measurements put it under suspicion for
; "the world is not textured", which is a texture-SUBSTITUTION symptom and this is the only
; mechanism in the shim that substitutes textures:
;
;   1. It rewrites the albedo on 238 of 756 converted draws a frame - a third of the world.
;   2. Its key holds a raw vertex-buffer POINTER with no reference on the buffer. That is the
;      same defect already found and fixed in three other caches: the streamer frees a buffer,
;      the allocator hands the address to a different one, and the key silently now names another
;      mesh. The AddRef added in the crash fix protects the TEXTURE, not the buffer the key is
;      built from.
;   3. Even with the buffer alive, a static buffer can be re-filled. 2,217 entries with 3 full
;      flushes in one session means roughly 14,500 distinct keys were seen - the regions churn
;      heavily, so a repeated key is not evidence of a repeated mesh.
;   4. "The world is not textured" first appeared at run 36, inside the window in which the world
;      moved to fixed-function conversion and this cache was added. Before that, session 9's
;      screenshots showed brick, stonework and wood flooring rendering correctly.
;
; If the world gains its textures back with this at 0, the cache is the cause and should be
; deleted rather than re-keyed - the streaming-eviction problem it was written for has never been
; observed directly, only inferred from the restore count it produces itself.
; If nothing changes, the cache is exonerated and the cause is on Remix's side of the bridge.
cacheMeshAlbedo=0

; ---------------------------------------------------------------- lights

; Translate the engine's inferred-lighting volumes into D3D9 lights, which Remix converts into
; real ray-traced lights. Recognised by the IR_Light_* constants in each volume's pixel shader.
injectLights=1
lightScalePercent=100
lightRangePercent=100

; ---------------------------------------------------------------- diagnostics

; Write one complete frame - every draw in submission order, grouped by render target, with
; states, shader properties, the disposition applied and WHY - to sr3-rtx-frame.log. This is the
; file to read to understand the engine rather than tune numbers; the two-pass inferred-lighting
; structure was found this way.
;
; The value is how many frames to WAIT after the camera first appears. 0 disables it. It used to
; dump the first frame with a camera, which meant it sampled a loading screen: the 2026-08-18 dump
; recorded 94 converted draws where steady-state gameplay has 1,079, and its 1,302 material-pass
; pass-throughs were mostly "main camera not latched yet" rather than anything real. At ~40 fps,
; 1800 frames is about 45 seconds - long enough to be in the world and moving.
;
; 2026-08-27: lowered to 60 (~1.5 s) because this value ALSO sets the delay after F9 re-arms the
; dump, and the head bug has to be caught while a specific NPC is on screen. The first automatic
; dump may now land during loading; the kDumpMinDraws=1500 guard retries every 60 frames until a
; real gameplay frame arrives, and F9 gives a second, aimed one in sr3-rtx-frame-1.log.
dumpFrame=60

; One frame of world-space bounding boxes for every draw near the camera, to sr3-rtx-shapes.log.
;
; This exists because "shapes around me" has been guessed at since session 9 and attributed, in
; turn, to light volumes, decals, texture problems and the geometry prepass - each time wrongly.
; A dish, a cap and a ring are all FLAT, which an axis-aligned box measures directly: the "flat"
; column is smallest axis over largest, so a disc reads near 0.0 and a cube near 1.0. Combined
; with size, distance from the camera, the shader name and the disposition, that should name each
; shape rather than describe it.
;
; One frame only, and only draws whose bounds are under 400 units and within 300 of the camera.
; The buffer LOCK is gated by the same conditions as the report - capping only the output while
; still locking a vertex buffer on every draw is a mistake this file has already made once.
shapeProbe=1

; One log line per distinct vertex declaration, capped at 24.
logLayouts=1

; Dump every render state for draws with these exact vertex counts, up to 30 lines. Vertex count
; is a stable property of a mesh, so it picks one specific shape out of ~2,600 draws a frame.
; Empty = off. This is how the prepass/material two-pass structure was identified.
probeVerts=

; Any frame at or above this many ms writes one HITCH line partitioning where the time went:
; inside the real Present (Remix's own end-of-frame work), our end-of-frame block, our draw path,
; our other hooks, and the remainder (the game's CPU work plus bridge submission).
;
; This exists because the previous TIMING line measured only the draw path, so "frame worst
; 115 ms | shim worst 4.6 ms" was read as "the hitch is not ours" when all it established was
; "the hitch is not in DrawIndexedPrimitive". Shader and texture creation, the render-target
; hook and Present itself were outside the measurement entirely.
;
; 40 ms is ~2.3 frames at the measured 58 fps. Capped at 60 lines per run.
hitchMs=40

; One frame of skinned-draw detail: vertex declaration (which fields carry blend weights and
; indices, and how they are stored), the vertex buffer's usage flags, how much of the 64-bone
; palette at c52 is live, objTM per character, and the raw weight/index bytes of a few vertices.
;
; This is the input to the CPU skinning port. The algorithm is already known from disassembling
; debug_diffuse_only_c.fxo_pc - pos' = (SUM w_i * Bone[idx_i]) * float4(pos,1) / SUM w_i, with
; objTM applied AFTER skinning - but the STORAGE of the weights is not in the shader, and
; UBYTE4 vs UBYTE4N cannot be told apart from the disassembly because the shader normalises by
; the weight sum either way. Getting that wrong produces subtly wrong poses, not an obvious error.
;
; The objTM column doubles as the direct test of the instance-matching theory: if characters
; carry distinct translations they ARE distinguishable to Remix and the AABB change is not the
; explanation.
skinProbe=1

; One frame of the WEIGHTLESS skinned layout - BLENDINDICES present, BLENDWEIGHT absent.
;
; This is the only refusal reason this shim has ever printed, and it accounts for all 38 refused
; skinned draws a frame. A refused draw passes through, so Remix reconstructs it beside the
; skinned copy: these 38 are a measured contributor to the double draw on characters.
;
; skinProbe cannot report on them - it returns early whenever blendWeightOffset is negative,
; which is exactly this layout - so nothing has ever read these bytes. Treating the layout as
; rigid single-bone attachment (weight 1.0 on index component 0) was tried on 2026-08-19 and
; made character clothing vanish; component 0 was an assumption rather than a measurement.
;
; This transforms one bind-pose vertex by the palette slot named by EACH of the four index
; components and prints all four results, with the length of each matrix's first row. A slot
; that owns the vertex puts it near the rest of the character and has a row length near 1; a
; slot that does not puts it at the origin or at a wild coordinate. That distinguishes "the
; wrong component was chosen" from "this layout is not bone-driven at all", which is the
; question the vanishing clothes left open.
rigidSkinProbe=1

; Convert identical skinned triangles only once per frame.
;
; Twice wrong before this, both times from keying on too little:
;   1. the key omitted the INDEX range, so every material sub-range of one 7,977-vertex mesh
;      counted as a duplicate of the first - the reported "69 of 88 repeats" was an artefact;
;   2. the key omitted the POSE, so two NPCs wearing the same garment hashed identically and the
;      second lost its clothing - "npc now have components from them disappearing and coming back".
;
; The key now folds in eight bone matrices from the c52 palette alongside the geometry, which is
; what makes "the same object" actually mean the same object. Two characters differ in their
; palette; one mesh submitted twice in one frame in one pose does not. Eight bones is 96 floats
; per draw against ~94 skinned draws a frame - cheap, and enough to separate characters.
;
; Duplicates are HIDDEN, not skipped: the engine still needs them for its own buffers.
;
; SR3 submits the same character geometry several times as layered blend passes. A rasteriser
; resolves those into one surface; a path tracer receives coincident duplicate surfaces, which
; is what "there are two renders of my character" looks like. The key is buffer + vertex range +
; INDEX range + triangle count, so only genuinely identical triangles are dropped - an earlier
; version keyed on the vertex range alone and counted every legitimate material sub-range of a
; 7,977-vertex mesh as a duplicate.
;
; Duplicates are HIDDEN, not skipped: the engine still needs them for its own buffers.
;
; dedupSkinned's KEY, CONTINUED - ON, 2026-08-20, on evidence rather than hope, and the user
; confirms it does NOT lose parts.
;
; Four earlier attempts merged draws that were not the same object. This time the key was analysed
; against a real frame BEFORE enabling it:
;
;   converted skinned draws in the frame                    75
;   groups the key would merge                              68
;     ...sharing one texture (safe to merge)                67
;     ...carrying DIFFERENT textures (would be WRONG)        1
;
; The one bad group was v=1080 p=499 at a single position with three different textures - three
; material layers on one head, of which two would have been dropped. So the ALBEDO went into the
; key: the fourth thing it had been missing, after the index range, the pose and the position.
;
; Exactly 5 draws a frame collapse, all but one at the player's own position, which matches the
; original report of the character being drawn twice.
;
; It does NOT fix the NPC head z-fighting. That is a different population, and no capture has yet
; caught it - which is what captureKey exists for. Refusals also reached 0 in run 56 while that
; z-fighting survived, so it is not the pass-through population either.
dedupSkinned=1

; Apply the SAME duplicate test to non-skinned draws.
;
; Measured 2026-08-27 across two aimed frame dumps: 53 groups of converted draws were identical
; in vertex count, triangle count, shader, bound texture AND position - 94 redundant coincident
; copies in one frame - and only 4 of them were skinned. Restricting the test to characters left
; almost all of the doubled surfaces in place. Example, byte for byte:
;
;      d7   CONVERT v=17601 p=494 zw=1 zt=1 blend=1 cw=0xf ps='Diffuse_MapSampler' tex0=48097178
;    d3296  CONVERT v=17601 p=494 zw=1 zt=1 blend=1 cw=0xf ps='Diffuse_MapSampler' tex0=48097178
;
; The key is the one dedupSkinned already used - buffer, vertex range, INDEX range, triangle
; count, objTM and bound albedo - minus the bone pose, which a rigid draw does not have, plus the
; INSTANCE transform. That last part matters: an instanced draw's objTM is identical across the
; whole batch (every one reports at(0.0 0.0 -1024.0)), so without it the key cannot tell two
; instances of a street prop apart and would delete one.
;
; If an instanced draw's placement cannot be read at all, the dedup DECLINES to judge it. A missed
; duplicate is a second surface; a wrong merge is a missing object.
;
; Falsifiers in the frame report:
;     DEDUP: N draws/frame hidden ... (K keys held, M/frame did not fit ...)
;     DEDUP declined on P draws/frame
; M must be 0 - non-zero means the key table filled and duplicates went MISSED while the counter
; still reported successes. Set dedupAll=0 to A/B without a rebuild.
dedupAll=1

; Apply the per-character MORPH delta when skinning. 0 renders the base mesh, which is what every
; build before 2026-08-27 did - that is the A/B, no rebuild needed.
;
; Found by disassembling ir_sr3npcskinfull_mc (the `_mc` variant - m for morph):
;
;     def c0, 0.000122070313, 2, -1, 3           c0.x = 1/8192
;     dcl_position v0 / dcl_position1 v4 / dcl_normal v2 / dcl_normal1 v5
;     mov r1.xyz, v4
;     mad r1.xyz, r1, c0.x, v0        <- position = v0 + v4/8192, BEFORE the bone blend
;     dp4 r2.x, r2, r1                <- then the bones, then objTM
;
; SR3's character customisation is a base mesh plus a per-character delta in stream 2, declared
; POSITION1 as short4 with NORMAL1 as ubyte4n beside it. The shim read only v0, so every NPC
; rendered with the SAME base head: a head that is nobody's, different from NPC to NPC, sitting
; slightly off the neck, on a surface its texture was not authored for. SHORT4 is not normalised,
; so the components arrive as raw integers and 1/8192 puts the delta in world units.
;
; The morph stream is part of the MESH IDENTITY, so it is folded into the bind-pose cache key:
; two NPCs share one base head buffer and differ only in their deltas, and a key built from
; stream 0 alone would serve the first NPC's face to every one after it.
;
; Verified across all 1,693 shader files before shipping: 384 skinned shaders read the morph
; stream and ALL 384 define the 1/8192 scale - zero exceptions. The 52 shaders that declare
; POSITION1 without it are all rl_particle_*, which are not skinned and never reach this path.
; The morph is also skipped unless the declaration says SHORT4, so an unexpected format falls
; back to the base mesh rather than being misdecoded.
;
; Falsifier in the frame report:
;     MORPH: N draws/frame use a shader that reads the morph stream | K meshes decoded WITH
;            their morph delta, U could not be read
; N non-zero with K zero means every one of them is still rendering the base mesh.
applyMorph=1

tintFallbackAlbedo=0

; Skin meshes whose declaration has BLENDINDICES but NO BLENDWEIGHT, treating them as rigid
; single-bone attachment (one bone, implicit weight 1.0).
;
; OFF - 2026-08-19. Turning it on took skinning refusals from 55/frame to 0, and in the same run
; "some character clothes items have vanished". Nothing else in that build touches clothing. The
; reasoning still looks sound, but so did the tint modulate and the dedup, and both were wrong.
; The likely truth is that these meshes are not bone-driven at all, so skinning them moves them
; somewhere off camera - which reads as vanishing rather than as a wrong pose.
;
; Off restores the previous behaviour: the draw is refused, passes through, and Remix reconstructs
; it. That brings the double-draw back for those items, which is the better of the two - a garment
; drawn twice is visible and wrong, a garment moved out of the world is simply gone.
;
; CURRENTLY ON. The paragraph above explains why it was tried OFF and reverted; the paragraph
; below explains why it was then safely turned back ON. Read them in that order - they are not two
; competing descriptions of the current value.
;
; MUST STAY 1. At 0, every vehicle body/glass/panel draw is refused outright and cars do not
; render at all.
skinRigidSingleBone=1
; ON again, 2026-08-20, because the reason it failed has been found and fixed.
;
; It was turned off after clothing VANISHED. The cause was not this setting: SkinAndBind was never
; passed baseVertex, so the bind pose was decoded from the WRONG WINDOW of the shared character
; buffer. Posing arbitrary geometry by a real bone matrix puts it somewhere the camera never looks,
; which is exactly what vanishing looks like. Fixed in run 50, and confirmed by heads becoming
; correct in the same run.
;
; Two measurements since also say the layout is what it appears to be: all four BLENDINDICES bytes
; are IDENTICAL on these draws, so component 0 was never a guess; and the bone palette is written
; 3-6 draws earlier with the same objTM, so it belongs to the draw rather than to a previous
; character.
;
; What this should fix: heads are rigid single-bone attachments - one bone, the neck - so they are
; refused, pass through, and Remix reconstructs them BESIDE our copy. That is the reported head
; z-fighting and its second, wrongly-textured copy. Hair is very likely the same, which would also
; explain it rendering white despite neither of its textures being white.
;
; If clothing vanishes again, this is wrong for a reason not yet found and it goes back to 0.

; ---------------------------------------------------------------------------------------------
; cameraOnly - the architecture test that came BEFORE remixApi: hand Remix a camera through
; SetTransform and touch NOTHING else, letting vertex capture reconstruct every draw.
;
; ANSWERED, 2026-08-30: Remix needs only a camera - but with vertex capture on it then
; reconstructs shadow casts, reflections, light volumes and collision shapes all at once, and
; at some viewing angles settles on a camera whose frustum misses the scene: the "world goes
; black at certain angles" symptom this project chased for weeks and blamed on the skip rules.
; BASELINE RESTORED, 2026-08-31: an experimental mode that degrades the image this much cannot
; be judged FROM, so it is off in the live configuration.
;
; These three keys were missing from this ini for that reason - left out rather than shipped
; off - even though worklog.md and this project's other docs instruct a reader to set them.
; They are added back here at the values already in force, so there is something in the file
; to point at instead of a silent built-in default.
cameraOnly=0
; Also convert SHORT2 texcoords on the pass-through draws cameraOnly leaves untouched, so the
; world keeps its UVs instead of reading as flat material colour. Only meaningful when
; cameraOnly=1.
;
; THIS IS THE SWITCH BEHIND A 33 GB VULKAN OUT-OF-MEMORY EVENT, 2026-08-30. On, it created
; 6,252 D3D9 vertex buffers across the 32-to-64-bit bridge in one run (against ~700 on the
; normal convert path), and the Remix log ended in "Heap 1: 33536 MB allocated ... 31571 MB
; total". Off, the same run completed clean with no memory diagnostic at all. Leave this off.
cameraOnlyFloatUV=0
; Give Remix only the MAIN scene camera out of the ~11 SetTransform targets a frame can carry
; (shadow cascades, the water reflection, cubemap faces, the main view).
;
; INERT under the live configuration: it is read only inside ApplyCameraOnly, which itself
; never runs while cameraOnly=0 above. Added here only so the built-in default (on) is not
; silently in force with nothing in the ini to show it.
cameraMainViewOnly=1

; ---------------------------------------------------------------------------------------------
; remixApi / remixApiCamera - Remix's PROGRAMMATIC interface. Step 1 of a new architecture.
;
; Found 2026-08-31 by reading exports: the 32-bit BRIDGE CLIENT d3d9.dll - the one SR3 actually
; loads, in the same process as this shim - exports remixapi_InitializeLibrary and
; remixapi_RegisterCallbacks. So Remix's API is callable from here. The interface carries
; CreateMaterial, CreateMesh, SetupCamera, DrawInstance, CreateLight, DrawLightInstance and
; dxvk_RegisterD3D9Device, which attaches to the game's EXISTING device.
;
; Why it matters: every hard problem in this project descends from one constraint - the only way to
; describe geometry to Remix was to fake a fixed-function draw or let vertex capture rebuild one.
; That produced the FFP conversion path and its 64-bone ceiling, the entire "which sampler is the
; albedo" apparatus, the SHORT2 texcoord problem, the camera reconstruction, and - with capture ON -
; Remix rebuilding EVERY draw, which is the shapes around the character and the blocked camera.
; CreateMesh/CreateMaterial/DrawInstance remove the constraint: we NAME the albedo instead of hoping
; Remix infers it from stage 0, and hand over vertices we have already CPU-skinned.
;
; remixApi=1 does ONLY two things and changes NOTHING about the image:
;   - InitializeLibrary, and report the return code
;   - RegisterD3D9Device on the game's device, and report the return code
; It exists to answer whether the bridge FORWARDS the API or merely exports the symbol and stubs
; the rest. Exporting a symbol is not proof of an implementation. Read this line in the log:
;
;   REMIX API: InitializeLibrary <rc> | RegisterD3D9Device <rc> | entry points <ALL PRESENT|INCOMPLETE>
;
; If entry points are INCOMPLETE, the whole approach is off the table and no further step is worth
; building. If both return SUCCESS and the entry points are all present, steps 2-4 are viable.
remixApi=1

; remixApiCamera=1 additionally hands Remix the camera through SetupCamera instead of SetTransform,
; using the SAME derivation and the SAME main-view gate as cameraOnly - so if the picture changes it
; is the API doing it, not a different camera. DEFAULT OFF so the first run carries no image risk.
; Flip to 1 for step 1b; no rebuild needed.
;
; UNVERIFIED: remixapi_CameraInfo takes float[4][4] with no documented row/column convention, and
; D3DMATRIX is row-major with row vectors. Passing it straight through is the hypothesis. A
; transposed camera looks wildly wrong rather than subtly wrong, so the failure is unmistakable.
remixApiCamera=0

; remixApiTestCube - STEP 2. One material, one mesh, one instance, submitted entirely through the
; Remix API with NO D3D9 draw behind it.
;
; A glowing GREEN cube, 3 units in front of the camera. Green because magenta already means
; "Remix ignored material" in this project and would be ambiguous the instant it appeared;
; EMISSIVE because a merely-lit object could be invisible for lighting reasons and would then be
; indistinguishable from "the API did nothing", which is the exact confusion step 2 exists to
; rule out.
;
; If the cube appears: geometry we describe ourselves reaches the path tracer, and the constraint
; behind nearly every hard problem in this project - that geometry could only arrive as a faked
; fixed-function draw or a vertex-capture reconstruction - is gone. Steps 3 and 4 (characters, then
; the world) become straightforward.
; If the log says DrawInstance succeeded but nothing is visible: the API accepts submissions that
; the renderer then discards, and the transform convention or the camera association is wrong.
;
; Nothing about the game's own rendering is touched either way - this is pure addition.
remixApiTestCube=0

; remixApiCharacter - STEP 3a. Submit ONE character mesh through the Remix API, ALONGSIDE the
; existing path rather than instead of it.
;
; A DOUBLED character is the proof it landed. Replacing the old path in the same change would make
; a missing character mean either "the API failed" or "the old path was removed correctly", and
; that ambiguity has cost this project whole sessions before.
;
; The CPU-skinned vertices are already exactly what Remix wants - SkinnedVertex is
; {pos[3], nrm[3], uv[2]} against remixapi_HardcodedVertex's same fields plus colour and padding -
; and they are already in WORLD space, so the instance transform is identity. The material names
; the character atlas DDS, so this is the first geometry in the project whose albedo we CHOSE
; rather than hoped Remix would infer from texture stage 0.
;
; Index rebasing, for the record: out[i] is the skinned vertex for original index
; (baseVertex + minIndex + i), and the game's indices address (baseVertex + idx), so the index into
; the captured array is (idx - minIndex).
remixApiCharacter=0

; remixApiClothAlbedo - let the CPU cloth baker (ClothAlbedo) REPLACE a customised slot's
; texture with a generated one, instead of only recognising the slot as customised.
; NOT gated on this for recognition - a guard once sat on the wrong side of that condition
; and silently stopped the slot being recognised at all, which stopped the CPU baker firing
; too. Missing from this ini before now; added at the built-in default.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
remixApiClothAlbedo=0
; remixApiCharacterOffset - stand the API character copy this many world units beside the
; game's own one instead of inside it, so two coincident copies do not z-fight (measured:
; z-fighting there reads as "the whole body with half the polygons missing at random").
; A DIAGNOSTIC offset, not the finished behaviour - it goes back to 0 once the game's own
; character copy is removed. Missing from this ini before now; added at the built-in default.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
remixApiCharacterOffset=3

; remixApiSkinning - STEP 3c. Let REMIX skin the character instead of the CPU.
;
; DEFAULT OFF because it CRASHED on 2026-09-02:
;   *** CRASH: 0xC0000005 at d3d9.dll +0x780CE, reading 4BD17000
;   ... inside the bridge, during the FIRST CreateMesh - the slot structure logged, then nothing.
; So Remix reads past one of the two skinning arrays. With this off, the character is submitted
; already-skinned and FROZEN, which is the state that works.
;
; What it does when on: the mesh is uploaded ONCE in its bind pose with remixapi_MeshInfoSkinning
; (bonesPerVertex 4, weights and bone indices from the shim's decoded bind pose, weights normalised
; because SR3's shader divides by their sum and Remix does not), and each frame the instance carries
; the bone palette through INSTANCE_INFO_BONE_TRANSFORMS_EXT. No per-frame CreateMesh.
;
; Two things were hardened after the crash and are worth keeping whatever the cause turns out to be:
;   - the FULL 64-bone palette is always sent, initialised to identity. maxBone is computed only
;     over NON-ZERO weights, so a vertex carrying a high index with a zero weight can legitimately
;     exceed it, and an index beyond boneTransforms_count would have Remix read past the array.
;   - the surface only claims skinning when BOTH arrays are exactly 4 x vertexCount.
;
; The header says the count must be bonesPerVertex * vertexCount, which is what is passed. If this
; still crashes with the guards above, the next suspect is the bridge's own marshalling of those
; arrays across the 32-to-64-bit boundary rather than anything in this file.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
remixApiSkinning=0

; bakeShaderAlbedo - run the GAME'S OWN PIXEL SHADER into a UV-space target and keep the result.
;
; DEFAULT OFF after it exhausted memory on 2026-09-03. See the caps below; turn it to 1 to test.
;
; WHY THIS EXISTS. Remix never runs a pixel shader - it picks one bound texture as the albedo and
; applies its own PBR model. SR3's clothing colour exists ONLY as a pixel shader's output: three
; constants weighted per texel by a Pattern_Map at gamma 2.2, a selector branch, then x Tint_color.
; No texture holds it and no constant equals it, so choosing a better texture or a better constant
; could never work - which is exactly what several attempts proved, one of them by blacking the
; player's top.
;
; The bake re-issues the game's draw with a hand-assembled vs_3_0 that maps UV to clip space, so
; screen space IS texture space and every output texel holds the colour that shader computes there.
; The game's pixel shader, constants and textures are used unchanged. The engine already uses this
; technique itself - the 2048x1024 character atlas is a bake.
;
; WHY IT CRASHED, and what changed:
;   - the budget counted SUCCESSES, so every failing attempt retried forever - for each customised
;     slot, every frame, each a full draw plus a GetRenderTargetData readback across the bridge, in
;     a 32-bit address space. A budget that only counts good outcomes is not a budget.
;   - now capped at 24 ATTEMPTS, disabled after 3 failures, and at most 2 bakes per frame.
;   - the target drops from 1024 to 512, so the render target, its readback surface and the
;     transient copy are 1 MB each rather than 4. This process already holds a skinning ring, a
;     96 MB snoop, a 48 MB uv arena and Remix's client.
;
; Each bake logs what it produced:
;   bake #N: wrote ...bake-N.dds | mean M of 255 over S samples, C% covered
; mean 0 / 0% covered means the draw landed outside the target - a uv mapping fault in the
; assembled shader. A sane mean with real coverage means the shader ran and produced colour, and
; the DDS can be looked at directly.
; The readiness setup (BakeShaderReady) still runs every frame once this is on, but the only
; caller that actually bakes a slot (BakeSlotAlbedo, from RemixCollectCharacterSlot) is itself
; gated on remixApiCharacter, so turning this on alone changes nothing visible.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
bakeShaderAlbedo=0

; clothUseDiffuse - multiply the customisation colour by the garment's Diffuse_Map.
;
; The stage probe (2026-09-04) showed two kinds of clothing draw:
;   albedo stage == pattern stage   - no diffuse map at all; the colour IS the lerp result
;   albedo stage 3, pattern stage 0 - a 256x256 diffuse and a 32x32 pattern
; The pattern is a small UNIFORM selector; the visible detail comes from the diffuse.
;
; Set to 0 to drop the diffuse multiply and use the flat customisation colour instead. That is an
; A/B for "is the diffuse making it too dark" without needing a rebuild.
; Read only inside CpuBakeCloth, whose only caller is RemixBuildCharacter.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
clothUseDiffuse=1

; clothBrightness - scales the baked cloth albedo. A PERCENTAGE: 100 = unchanged, 200 = double.
;
; This is a TUNING KNOB, not a fix, and it is worth being clear about why it exists.
;
; The recipe is verified correct against both the exe and the shader:
;   - the engine divides the 8-bit swatch by 255 (exe 0x008FCE60, divisor decodes to 255.0)
;   - the shader lerps from WHITE toward each colour by a pattern channel, and r1.x in that lerp
;     is c6.x = 1.0, so it is exactly the lerp it appears to be
;   - bake #2 computes (84 0 0) from colour C = 0.40 and a diffuse of 0.82, which is precisely
;     what that shader would produce
;
; It still reads too dark in the path traced image. That means Remix lights this mesh differently
; from how the game lit it - the albedo is right and the LIGHTING differs. That question is open.
; Until it is answered, this makes the result usable rather than correct.
;
; Try 150 or 200. If a value looks right, that number is itself evidence about the lighting gap.
; Read only inside CpuBakeCloth, whose only caller is RemixBuildCharacter. The game's OWN
; character path (ClothAlbedo, ClothAlbedoUniform, HairAlbedo) reads neither cloth knob - see
; clothAlbedoPercent above for the switch that actually reaches them.
; API character path only (remixApiCharacter=1) - does nothing in the live configuration.
clothBrightness=100
; Demote the HUD (arriving via DrawPrimitiveUP, unclassified since the fork) to a UI overlay
; instead of leaving it unclassified. 0 restores that - the A/B for anything this changes.
uiDemoteUP=1
; REBUILD the demoted HUD as a fixed-function draw instead of merely demoting it, so it survives
; capture-off (Remix declines a shader draw with vertex capture off; a fixed-function draw it
; accepts).
uiConvertUP=1
; 1 restores the double draw found 2026-09-11: after a HUD draw was rebuilt as fixed function
; the game's own draw still went out (a missing brace), float4 PIXEL positions as world
; coordinates - the menu, the map and the HUD a thousand units above the player. Keep 0.
uiRawAfterHud=0
; One-shot probe that dumps every draw into a character-atlas-sized render target, because the
; atlas composites at character load rather than per frame, so no ordinary frame dump catches it.
atlasCompositeProbe=1
; KEEP the game's own pixel shader on the rebuilt HUD draw instead of nulling it (which is what
; this shim does for world geometry). For the UI the pixel shader IS the content; nulling it
; produced a greyscale menu video, missing text and blank backgrounds.
uiKeepPixelShader=1
; Re-issue the character atlas composite draws as fixed function with the game's own pixel
; shader, the same technique that brought the HUD/menu video back, so they survive capture-off.
compositeFfp=1
; Census of every draw still passed through unconverted. With capture off a passed-through
; shader draw is invisible, so this names exactly what is being lost, by pixel shader and
; render target.
passCensus=1
; Read the UV divide from the vertex shader's own `def` constant instead of assuming the
; hardcoded 1/1024. 0 (the shipped value): the hardcoded value has been correct on everything
; measured so far, so this exists to test that assumption rather than to be relied on.
uvScaleFromShader=0
; Generate the player clothing family's albedo from the Diffuse_Map in its own texture space
; when the pattern is a single uniform colour. See ClothAlbedoUniform.
clothUniformFromDiffuse=1
; Give hair its strand detail by modulating hair colour with the Dob_Map's strand channel,
; instead of shipping one flat colour. 0 restores the flat constant.
hairStrandsFromDob=1
; Last resort for a garment whose pattern is a decal on an independent UV set: tint the whole
; surface with the pattern's dominant colour. An approximation - it gets the garment's colour
; right and loses the decal. 0 leaves such garments untinted, which is what they were.
clothDominantPattern=1
; Fill the UNUSED space in a generated cloth albedo with the garment's own colour instead of
; leaving it black - a converted draw has no pixel shader to clamp a sample inside its island.
clothPadUnused=1
; THE CUTOUT. Keep the bra's/underwear's alpha cutout through dilation and alpha-test the
; converted draw, so their template mesh's spare quads read as invisible instead of opaque
; black squares. See THE CUTOUT in docs/YOUR-INSTRUCTIONS.md.
clothCutout=1
; THE DECAL, THROUGH THE MESH. Resolve an INDEPENDENT pattern/albedo UV pair (bra, underwear)
; by rasterising each visible triangle in the albedo's space and interpolating uv1, so every
; albedo texel gets the pattern texel the mesh says it should have.
clothMeshDecal=1
; TILES. Give each conflicting mesh-decal component its own tile in the generated texture, for
; a garment (the bra's two cups) whose mirrored UVs disagree about one shared island.
clothDecalTiles=1
; THE COLOUR CURVE. Reinhard tonemap (x/(1+x)) on Tint*colour instead of a linear scale - what
; turns the underwear's measured blue into the game's cyan. Player-family generator only; hair
; and the NPC path are unchanged and read clothAlbedoPercent/clothBrightness directly instead.
clothColourCurve=1

; ---------------------------------------------------------------------------------------------
; decalUvFromDeclaredSet - FIX A: sample a decal's albedo from vertex TEXCOORD1, not TEXCOORD0,
; when that is what the bound VERTEX SHADER actually declares.
;
; The shim has always converted and sampled usage-index 0 unconditionally: TEXCOORDINDEX forced
; to 0, SHORT2 widened to float2 through UvBufferFor/FloatUVDeclaration, scaled by the 1/1024 uv
; matrix. Several shader families disassemble to something different - they build their decal
; coordinate from vertex TEXCOORD1 and declare NO usage-index-0 input at all:
;
;     ir_at_sr3decalonly_{s,bs}            vertex shaders 0-4
;     ir_sr3diffcol_normal_decal_{s,bs}    vertex shaders 2-5
;     ir_at_decalonly_cuberef_*            vertex shader 5
;     ir_sr3fauxinterior_{s,bs}            vertex shaders 0-1   (fake window interiors)
;
; Sampling index 0 regardless textures those draws with whatever unrelated data happens to sit
; there, or with nothing at all - and because InstallFloatUV's old single gate tested only set
; 0's fields, the "nothing at all" case returned false immediately with NOTHING counted, so
; "failures: 0 convert" in the frame report could never see it.
;
; DecalUvSourceSet reads two new ShaderInfo fields (declaresTexcoord0, lowestDeclaredTexcoord)
; recorded straight from the VERTEX shader's own dcl_texcoordN INPUT instructions - never from a
; pixel shader's dcl_texcoordN, which names an interpolator input, a different thing entirely -
; and answers "sample set 1" exactly when a shader declares texcoord1 but not texcoord0.
; UvBufferFor, FloatUVDeclaration and the uv buffer/declaration caches all key on the chosen set,
; so a conversion made for one is never handed to a draw that wanted the other.
;
; Falsifier, on the existing SHORT2 report line:
;     FIX A decal texcoord1 set: N/frame served, M/frame wanted but unavailable
; N > 0 means this is doing something; M > 0 names draws whose vertex shader wants TEXCOORD1 but
; whose bound declaration has no usable SHORT2 element for it - a real anomaly worth a look, not
; the everyday "doesn't need conversion" case (which this switch never counts as a failure).
;
; 0 restores the old behaviour: every draw is sampled from set 0 regardless of what its vertex
; shader declares.
decalUvFromDeclaredSet=1

; FIX A sources a decal's coordinates from vertex TEXCOORD1 and deliberately writes the RAW
; short values, because the uv texture matrix is supposed to carry the 1/1024. But the matrix
; scale was derived from texcoordType, which is always set 0, and for exactly the families FIX A
; exists for there is often no stream-0 TEXCOORD0 at all, so the type read -1, the scale stayed
; 1.0 and the texture transform was DISABLED. Raw shorts then reach the sampler, and 1024 raw
; units is 1.0 UV, so the quad samples about a thousand repeats of its texture: a fine striped
; band instead of an image. At 1 the scale is taken from the set the conversion actually used.
; Note this path did NOT fire at the building under investigation (all three FIX A counters read
; 0.0/frame there), so this is a bug fixed on its own merits, not a proven cure. The new counter
; on the SHORT2 report line says how often the corrected branch disagrees with the old one.
decalUvScaleFromSet=1

; ---------------------------------------------------------------------------------------------
; decalAlphaFromTexture - FIX B: let a genuinely-blended decal take its alpha from the TEXTURE
; instead of TFACTOR, so it blends onto the surface beneath it instead of covering it.
;
; SetupTextureStages decides alpha with cutout = (alphaTest && alphaRef > 0) || shaderCutout,
; where shaderCutout is true only when the pixel shader declares Alpha_Threshold (see the
; ir_at_* family and its texkill). Three decal families do NOT declare it and are blended by the
; GAME instead: their pixel shader computes
;
;     alpha = decal.a * Decal_Map_Opacity * Tint_color.a
;
; and the draw is submitted with real SRCALPHA/INVSRCALPHA factors - the frame dump shows
; blend=1(5/6) on them. Under the plain cutout rule those draws took ALPHAARG1 from TFACTOR,
; i.e. alpha 1.0, so the decal rendered as an OPAQUE rectangle sitting on top of the surface
; instead of blending onto it.
;
; The gate is deliberately narrow: the CHOSEN albedo sampler's name must contain "Decal", AND
; the draw must be genuinely blended by its factors - reusing, verbatim, the trulyBlended test
; the decal-offset code elsewhere in this file already computes (ALPHABLENDENABLE on, and the
; factor pair is not the ONE/ZERO SR3 leaves set on its own opaque draws). A wall material that
; happens to sample a Decal_Map alongside its Diffuse_Map is left alone, because it is not
; blended; an alpha-test cutout is untouched, because shaderCutout already routes it correctly
; and this switch only ever ADDS a second way to reach D3DTA_TEXTURE, never removes the first.
;
; Falsifier, on the existing albedo report line:
;     FIX B decal alpha from texture: N/frame
; N > 0 means this is doing something; N == 0 means either no such draw was converted this run
; or the gate is not matching what it was aimed at.
;
; 0 restores the old behaviour: every non-cutout draw, blended decals included, takes alpha 1.0
; from TFACTOR.
decalAlphaFromTexture=1

; ---------------------------------------------------------------------------------------------
; decalProbe - DIAGNOSTIC for the building-decal stripe-pattern bug: signs, logos and posters
; (the family whose CHOSEN albedo sampler name contains "Decal") render as a flat quad showing a
; fine repeating stripe pattern instead of their image. FIX A and FIX B above did not change it.
;
; Ruled out by measurement already: depth, blinking, albedo churn, the alpha path (FIX B fires 4
; times a frame on these exact draws), the texcoord SET these shaders read (set 0, which is what
; is converted) and the tiling lookup (it resolves correctly for this family). What has NEVER
; been measured is the only thing left that decides what appears on the quad: which texture is
; actually bound as albedo, and what coordinate range is fed to it.
;
; ProbeDecalDraw reports both, for the first 8 converted draws whose chosen albedo sampler names
; a Decal map: the sampler identity, the bound texture's own GetLevelDesc (size/format/mips/
; pool/usage), the su/sv SetupTextureStages actually applied to the texture matrix, and - read
; from the draw's own INDEX range rather than its much larger vertex-buffer WINDOW - the raw
; SHORT2 texcoord lanes and the resulting UV they produce. It sets no render state and changes no
; pixel; it only logs.
;
; 0 disables the probe entirely.
decalProbe=1

; decalProbeDumpTexture - alongside decalProbe's log block, also write the bound albedo's top mip
; as an uncompressed BGRA8 .dds beside the shim's other dumps (sr3-remix-decalprobe-N-WxH.dds),
; reusing TextureToBgra/WriteBgraDds so the alpha channel written is the texture's own, not a
; fabricated 255 (see WriteBgraDds's history - that trap cost a whole day once already). If the
; texture cannot be locked, or is a format TextureToBgra does not decode, the log line says so
; with the HRESULT instead of the dump failing silently.
;
; 0 logs the same identity/scale/UV block without writing a file.
decalProbeDumpTexture=1

; The probe armed on the first eight draws with a Decal-named albedo, and on 2026-09-18 all
; eight were the SAME particle billboard: verts=20 prims=10 at the world origin, on a DYNAMIC
; stream 0, which the read-lock guard then refused. A whole run learned nothing. At 1 a draw
; only takes one of the eight slots if its stream 0 is static, it is indexed, and an object
; transform places it somewhere other than the origin, which is what a building decal looks
; like. Every rejection is counted by reason and printed, so if it misses again the log says
; which test excluded the target instead of leaving it to be guessed a third time.
decalProbeStrictTarget=1

; Never take COLOUR from a texture that has none.
;
; Measured 2026-09-18: seven of the eight probed world decal draws bind a D3DFMT_A8 texture as
; their albedo. That format is alpha only, no colour channels at all, and the converted draw's
; stage 0 does COLOROP = SELECTARG1 with COLORARG1 = TEXTURE, so it selects the colour of a
; texture that has none. The game's own pixel shader uses that map as a MASK and takes its
; colour from a shader constant. This shim already had the function that answers the question,
; FormatColourChannels, and asked it only about render targets, never about the texture it
; picks as an albedo.
;
; At 1 a colourless albedo keeps its alpha (the mask is the point) and its colour comes from
; TFACTOR instead. NOTE what that currently means: in this branch TFACTOR is forced to opaque
; white, so this turns a black rectangle into a white shape cut by the mask. That is better,
; not right. Resolving the real per-family colour constant (Decal_Map_Color and friends) is the
; follow-up, and the new count of distinct alpha-only textures on the ALBEDO report line is
; what decides whether that is worth building.
albedoRejectColourlessTexture=1
