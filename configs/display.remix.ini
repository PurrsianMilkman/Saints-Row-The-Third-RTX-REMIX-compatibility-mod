# Display options — Remix triage profile for Saints Row: The Third.
# Deployed over display.ini by tools\deploy-conf.ps1 (original backed up as display.ini.pre-remix).
# Rationale for every change: docs\compatibility-notes.md ("In-game settings for triage").
# NOTE: the game rewrites this file when options are changed in its menu — avoid touching
# display settings in-game, or re-deploy afterwards.

ResolutionWidth = 1600
ResolutionHeight = 900
RefreshRate = 144

# MSAA is a hard incompatibility with Remix. Never turn this back on.
MSAA_Level = 0

Fullscreen = false
DisplayIndex = 0
VerifyResolution = true

# Let DXVK/Remix own presentation.
VSync = false

# Custom preset so the values below are honored.
Preset = 5

TextureDetailLevel = 0
AnisoLevel = 16

# Simplest deferred path the engine offers.
LightingDetail = 1

# Fullscreen AO / post / blur / reflection / shadow passes are garbage input for the
# path tracer — kill them at the engine level rather than filtering in rtx.conf.
SSAO_Level = 0
ShadowDetail = 0
SceneDetail = 3
Reflections = 0
MotionBlur = false
PostProcess = 0

LetterboxEyefinity = true
InputDeviceAutoDetect = true
