; sr3-engine.asi - SR3 engine renderer control, standalone
;
; This plugin is SEPARATE from sr3-rtx.asi and does not interact with it:
;   sr3-rtx.asi     hooks D3D9 (the device vtable)      -> sr3-rtx.log,    sr3-rtx.ini
;   sr3-engine.asi  hooks the ENGINE's dispatch table   -> sr3-engine.log, sr3-engine.ini
; Different tables, different logs, different settings. Either can be deleted from the game folder
; without affecting the other.
;
; A SETTING HERE IS A HYPOTHESIS THAT IS NOT YET SETTLED. Once measured, a behaviour moves into the
; code with the measurement recorded beside it, and its switch is deleted.

[sr3-engine]

; Hook SR3's own 74-entry render-command dispatch table at 0x013509F8.
;
; SR3 is a command-buffer renderer: a producer thread writes command blocks into a ring, and a
; render thread at 0x0049DE20 consumes them, dispatching each command through that table. It sits
; in WRITABLE .data, so hooking the engine's renderer is a matter of writing 74 pointers - which
; puts our code INSIDE the engine, one level above D3D9, where a command is still a command rather
; than six loose arguments.
;
; STAGE 0 IS INERT. Every thunk increments its opcode's counter and calls the original handler.
; Nothing is dropped, rewritten or reordered.
;
; It REFUSES to write unless the live table matches the shipped exe entry for entry. That check is
; not ceremony: docs/engine-map.md records a static map that was wrong by 0x81C000 and was caught
; by exactly this kind of runtime check before anything was patched. It also catches another mod
; having hooked the table first.
;
; 0 makes this plugin completely inert - it loads, logs one line, and touches nothing.
engineHooks=1

; How often the census is written to sr3-engine.log, in seconds.
;
; There is no Present hook here - this plugin does not touch D3D9 at all - so the report runs on a
; timer and rates are PER SECOND rather than per frame.
;
; THE CENSUS IS THE FALSIFIER. A hook that installed but never runs and a hook that never installed
; look identical from outside the process. Only this listing separates them:
;
;   "74/74 dispatch entries hooked | N commands dispatched"  -> live, with a per-opcode breakdown
;   "ZERO commands dispatched"   -> the table was written but our thunks never ran. NOT live, and
;                                   nothing else in the block is evidence.
;   "not installed"              -> a check refused, and the line above says which.
;
; It also counts dispatches of the 16 STUB opcodes. The stub at 0x004BF550 is a bare `ret` that
; never advances the command read pointer, so if the engine ever emitted one the render thread
; would spin on it forever. Expected 0; non-zero would mean the opcode map is incomplete.
reportSeconds=10

; Milliseconds to wait after the DLL loads before writing into the engine's .data.
;
; The table's values come straight from the PE image so they are valid at load, but a delay costs
; nothing and removes the question of racing the engine's own initialisation. If verification fails
; it is retried for ~20s before giving up, so a slow start is not a hard failure.
installDelayMs=3000

; ---------------------------------------------------------------- stage 1: dropping commands

; Drop draws through the ENGINE'S OWN kill-switch.
;
; To suppress a draw the plugin does NOT skip the handler and advance the command read pointer
; itself. It sets the engine's kill-switch at 0x03395EA4, calls the original handler, and puts the
; switch back:
;
;     set 0x03395EA4  ->  call original handler  ->  restore 0x03395EA4
;
; Both paths through a draw handler advance the read pointer by the SAME amount - op 42's draw path
; at 0x49D692 and its kill path at 0x49D6B5 both `add [0x2e5d650], 0x1c`. So the engine does its own
; size arithmetic and there is no way to desynchronise the command block. It also covers op 43,
; whose size was never resolved statically, and it leaves the engine's own skipped-draw flag
; consistent - because this is exactly the path SR3 takes when its own culling hides an object.
;
; A GUARD stands in front of it. The kill path dereferences [0x351F8F8] -> +0x50 -> +4 and WRITES
; there, so that chain is validated as committed and writable before the switch is armed, and
; re-validated whenever the root pointer changes. If it does not validate the draw is passed
; through untouched and the refusal is counted rather than risking a fault inside the engine.
;
;   0  off. The primitive never fires. This is the A/B.
;   1  drop one draw in every dropOneInN. Visible, the game stays playable, and the reported
;      percentage should match 100/dropOneInN - which is a real check, not a self-assessment.
;   2  drop EVERY draw. The unambiguous proof: if the primitive is correct the image empties out
;      and the game keeps running at a normal frame rate. A hang or a crash would mean the read
;      pointer desynchronised, which routing through the engine's own kill path is meant to make
;      impossible. Set it back to 0 afterwards.
;
; THE FALSIFIER is the DROPS line in the census - drops counted against draws seen, with refusals
; counted separately. A black image on its own cannot distinguish "the drop worked" from "the game
; stopped"; those three numbers can.
;
; PROVEN 2026-09-07 with dropMode=1, dropOneInN=2: 5,831,974 draws seen, 2,915,987 dropped -
; EXACTLY 50.0%, 0 refused, no crash and no hang across 42.5M dispatched commands. The read pointer
; never desynchronised, which is what routing the drop through the engine's own kill path is for.
;
; BACK TO 0. The primitive does not need re-proving, and a correct pass census wants the game
; rendering normally.
dropMode=0

; For dropMode=1. Minimum 2.
dropOneInN=2

; Count draws per render target.
;
; A pass boundary in this engine is exactly a SetRenderTarget command (op 9), and the surface is at
; [cmd+8] - read from the handler at 0x0049CB00, which dispatches to vtable+0x94 = slot 37. So the
; render target a draw belongs to is read from the command rather than inferred from formats or
; sampler names, which is what every pass-classification rule in the main shim has been
; approximating. This is the unit stage 2 will filter on.
passCensus=1
